# Actions 화면에 표시할 자동화 작업 이름입니다.
name: Deploy Zola blog

# main에 변경 내용을 저장하면 자동으로 실행합니다.
on:
  push:
    branches: ["main"]

  # Actions 화면에서 수동으로 실행하는 기능도 유지합니다.
  workflow_dispatch:

# 저장소 파일을 읽을 수 있도록 허용합니다.
permissions:
  contents: read

# 공개 작업이 동시에 실행되지 않도록 합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 네 컴퓨터가 아니라 GitHub의 기본 Ubuntu 환경입니다.
    runs-on: ubuntu-latest

    steps:
      # 1. 네 저장소의 글과 설정 파일을 가져옵니다.
      - name: Read repository files
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 2. Duckquill 테마를 GitHub의 작업용 폴더에 가져옵니다.
      - name: Download Duckquill theme
        shell: bash
        run: |
          # 명령 실행 중 오류가 발생하면 이후 작업을 중단합니다.
          set -euo pipefail

          # 테마를 받을 폴더를 준비합니다.
          mkdir -p themes/duckquill
          git -C themes/duckquill init

          # Duckquill의 공식 원본 저장소를 연결합니다.
          git -C themes/duckquill remote add origin https://codeberg.org/daudix/duckquill.git

          # 사용할 버전을 고정해서 가져옵니다.
          git -C themes/duckquill fetch --depth=1 origin 5b0c3fca2481b4a074fc9b8cc2cffc649de9e182
          git -C themes/duckquill checkout --detach FETCH_HEAD

      # 3. 기존과 동일하게 Zola로 웹페이지를 생성합니다.
      - name: Build blog with Zola
        uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
        with:
          zola_version: "v0.23.6"

  deploy:
    # 웹페이지 생성에 성공했을 때만 공개합니다.
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 4. 완성된 웹페이지를 GitHub Pages에 공개합니다.
      - name: Publish blog
        id: deployment
        uses: actions/deploy-pages@v4
