<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1120" viewBox="0 0 1040 1120" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Match the full shape of both paths before residual addition</title><desc id="desc">For unchanged shapes, add the original input directly. To change 16 channels at 14×14 into 32 channels at 7×7, both the main path and shortcut produce the target shape. These educational blocks apply ReLU after addition.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6078"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="1040" height="1120" rx="22" fill="#f7f9fc" stroke="none" stroke-width="1.5"/>
<text x="34" y="48" font-size="30" fill="#17253d" font-weight="700" text-anchor="start">Match the full shape of both paths before residual addition</text>
<text x="34" y="84" font-size="19" fill="#4e6078" font-weight="400" text-anchor="start">Add values at matching sample, channel, row, and column indices.</text>
<rect x="28" y="112" width="984" height="455" rx="16" fill="white" stroke="#b8c6d8" stroke-width="1.5"/>
<text x="52" y="146" font-size="25" fill="#17253d" font-weight="700" text-anchor="start">① Shape-preserving block: identity shortcut</text>
<rect x="340" y="165" width="360" height="77" rx="12" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="520.0" y="196" font-size="22" fill="#235fbe" font-weight="700" text-anchor="middle">Original input x</text>
<text x="520.0" y="227" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">[N, 16, 14, 14]</text>
<path d="M520 243V262H274V286" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M520 262H766V286" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="300" width="432" height="119" rx="12" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="274.0" y="331" font-size="22" fill="#7043b5" font-weight="700" text-anchor="middle">Main path</text>
<text x="274.0" y="362" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">3×3 Conv (16→16) → ReLU</text>
<text x="274.0" y="390" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">3×3 Conv (16→16), stride=1</text>
<rect x="550" y="300" width="432" height="119" rx="12" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="766.0" y="331" font-size="22" fill="#177052" font-weight="700" text-anchor="middle">Shortcut</text>
<text x="766.0" y="362" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">Pass x through unchanged</text>
<text x="766.0" y="390" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">No extra shortcut parameters</text>
<text x="274" y="448" font-size="23" fill="#17253d" font-weight="700" text-anchor="middle">[N, 16, 14, 14]</text>
<text x="766" y="448" font-size="23" fill="#17253d" font-weight="700" text-anchor="middle">[N, 16, 14, 14]</text>
<path d="M274 456V478H491" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M766 456V478H549" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="520" cy="478" r="23" fill="#fff1dd" stroke="#aa530e" stroke-width="2"/>
<text x="520" y="487" font-size="29" fill="#aa530e" font-weight="700" text-anchor="middle">+</text>
<path d="M520 503V522" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="551" font-size="25" fill="#17253d" font-weight="700" text-anchor="middle">ReLU → [N, 16, 14, 14]</text>
<rect x="28" y="594" width="984" height="455" rx="16" fill="white" stroke="#b8c6d8" stroke-width="1.5"/>
<text x="52" y="628" font-size="25" fill="#17253d" font-weight="700" text-anchor="start">② Shape-changing block: projection shortcut</text>
<rect x="340" y="647" width="360" height="77" rx="12" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="520.0" y="678" font-size="22" fill="#235fbe" font-weight="700" text-anchor="middle">Original input x</text>
<text x="520.0" y="709" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">[N, 16, 14, 14]</text>
<path d="M520 725V744H274V768" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M520 744H766V768" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="58" y="782" width="432" height="119" rx="12" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="274.0" y="813" font-size="22" fill="#7043b5" font-weight="700" text-anchor="middle">Main path</text>
<text x="274.0" y="844" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">3×3 Conv (16→32), stride=2</text>
<text x="274.0" y="872" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">ReLU → 3×3 Conv (32→32)</text>
<rect x="550" y="782" width="432" height="119" rx="12" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="766.0" y="813" font-size="22" fill="#177052" font-weight="700" text-anchor="middle">Shortcut</text>
<text x="766.0" y="844" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">1×1 Conv (16→32), stride=2</text>
<text x="766.0" y="872" font-size="20" fill="#17253d" font-weight="400" text-anchor="middle">Separate learned weights</text>
<text x="274" y="930" font-size="23" fill="#17253d" font-weight="700" text-anchor="middle">[N, 32, 7, 7]</text>
<text x="766" y="930" font-size="23" fill="#17253d" font-weight="700" text-anchor="middle">[N, 32, 7, 7]</text>
<path d="M274 938V960H491" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M766 938V960H549" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="520" cy="960" r="23" fill="#fff1dd" stroke="#aa530e" stroke-width="2"/>
<text x="520" y="969" font-size="29" fill="#aa530e" font-weight="700" text-anchor="middle">+</text>
<path d="M520 985V1004" fill="none" stroke="#4e6078" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="1033" font-size="25" fill="#17253d" font-weight="700" text-anchor="middle">ReLU → [N, 32, 7, 7]</text>
<text x="520" y="1087" font-size="20" fill="#4e6078" font-weight="400" text-anchor="middle">3×3 Conv: padding=1 · unmarked stride is 1 · educational blocks omit BatchNorm</text>
</svg>
