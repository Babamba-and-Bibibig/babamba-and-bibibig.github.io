<rect x="750" y="615" width="300" height="100" rx="13" fill="#e7f5ef" stroke="#15715d" stroke-width="1.6"/>
<text x="900.0" y="657.0" font-size="22" font-weight="700" fill="#15715d" text-anchor="middle">Result 2: images 512–599</text>
<text x="900.0" y="689.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">(88, 1, 28, 28)</text>
<path d="M 900,725 L 900,755 L 550,755 L 550,790" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="100" y="800" width="900" height="100" rx="13" fill="#e7f5ef" stroke="#15715d" stroke-width="1.6"/>
<text x="550.0" y="842.0" font-size="24" font-weight="700" fill="#15715d" text-anchor="middle">torch.cat(results, dim=0)</text>
<text x="550.0" y="874.0" font-size="24" font-weight="400" fill="#192c43" text-anchor="middle">All reconstructions: (600, 1, 28, 28)</text>
<text x="550" y="951" font-size="23" font-weight="700" fill="#192c43" text-anchor="middle">Concatenate along the existing image axis. No new axis; no pixel summation.</text>
