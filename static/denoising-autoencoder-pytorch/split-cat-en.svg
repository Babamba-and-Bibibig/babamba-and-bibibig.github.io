<path d="M 550,235 L 550,260 L 900,260 L 900,290" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="50" y="300" width="300" height="110" rx="13" fill="#eaf3fc" stroke="#245b93" stroke-width="1.6"/>
<text x="200.0" y="347.0" font-size="22" font-weight="700" fill="#245b93" text-anchor="middle">Chunk 0: images 0–255</text>
