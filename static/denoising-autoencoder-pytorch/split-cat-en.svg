<rect x="50" y="480" width="300" height="75" rx="13" fill="#f1ecf9" stroke="#7351a0" stroke-width="1.6"/>
<text x="200.0" y="509.5" font-size="21" font-weight="700" fill="#7351a0" text-anchor="middle">model(part)</text>
