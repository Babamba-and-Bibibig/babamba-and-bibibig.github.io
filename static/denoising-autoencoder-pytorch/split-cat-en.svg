<text x="550.0" y="347.0" font-size="22" font-weight="700" fill="#9a610e" text-anchor="middle">Chunk 1: images 256–511</text>
<text x="550.0" y="379.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">(256, 1, 28, 28)</text>
<path d="M 550,420 L 550,470" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
