<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1020" viewBox="0 0 1100 1020" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Train the encoder and decoder against the clean target</title>
<desc id="desc">The clean image supplies both the noisy input and the target. The encoder computes features, the decoder reconstructs the image, and the loss drives gradients and updates for both modules.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10 Z" fill="#59718a"/></marker><marker id="update" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10 Z" fill="#7351a0"/></marker></defs>
<style>text{font-family:"Pretendard","Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","DejaVu Sans",sans-serif} .code{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1100" height="1020" rx="18" fill="#f5f7fb"/>
<text x="38" y="53" font-size="32" font-weight="700" fill="#192c43" text-anchor="start">Train the encoder and decoder against the clean target</text>
<text x="38" y="92" font-size="21" font-weight="400" fill="#4c6076" text-anchor="start">Solid arrows: data and results · Purple dashed arrows: parameter updates</text>
<rect x="335" y="265" width="720" height="320" rx="13" fill="#fff" stroke="#d4deea" stroke-width="1.6"/>
<text x="355" y="294" font-size="19" font-weight="700" fill="#4c6076" text-anchor="start">Model forward pass</text>
<rect x="50" y="130" width="300" height="90" rx="13" fill="#eaf3fc" stroke="#245b93" stroke-width="1.6"/>
<text x="200.0" y="167.0" font-size="22" font-weight="700" fill="#245b93" text-anchor="middle">Clean original</text>
<text x="200.0" y="199.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">clean</text>
<rect x="700" y="130" width="350" height="90" rx="13" fill="#eaf3fc" stroke="#245b93" stroke-width="1.6"/>
<text x="875.0" y="167.0" font-size="22" font-weight="700" fill="#245b93" text-anchor="middle">Noisy input</text>
<text x="875.0" y="199.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">noisy</text>
<path d="M 355,175 L 690,175" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="520" y="153" font-size="21" font-weight="400" fill="#192c43" text-anchor="middle">Add noise + clamp</text>
<rect x="700" y="320" width="330" height="90" rx="13" fill="#f1ecf9" stroke="#7351a0" stroke-width="1.6"/>
<text x="865.0" y="357.0" font-size="22" font-weight="700" fill="#7351a0" text-anchor="middle">Encoder</text>
<text x="865.0" y="389.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">Conv2d → ReLU</text>
<path d="M 875,225 L 875,310" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="365" y="320" width="270" height="90" rx="13" fill="#fff3db" stroke="#9a610e" stroke-width="1.6"/>
<text x="500.0" y="357.0" font-size="22" font-weight="700" fill="#9a610e" text-anchor="middle">Intermediate features</text>
<text x="500.0" y="389.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">features</text>
<path d="M 690,365 L 645,365" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="365" y="465" width="270" height="90" rx="13" fill="#f1ecf9" stroke="#7351a0" stroke-width="1.6"/>
<text x="500.0" y="502.0" font-size="20" font-weight="700" fill="#7351a0" text-anchor="middle">Decoder</text>
<text x="500.0" y="534.0" font-size="17" font-weight="400" fill="#192c43" text-anchor="middle">ConvTranspose2d → Sigmoid</text>
<path d="M 500,420 L 500,455" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="700" y="465" width="330" height="90" rx="13" fill="#e7f5ef" stroke="#15715d" stroke-width="1.6"/>
<text x="865.0" y="502.0" font-size="22" font-weight="700" fill="#15715d" text-anchor="middle">Reconstruction</text>
<text x="865.0" y="534.0" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">reconstructed</text>
<path d="M 645,510 L 690,510" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="700" y="655" width="350" height="95" rx="13" fill="#fcecf0" stroke="#a43543" stroke-width="1.6"/>
<text x="875.0" y="694.5" font-size="22" font-weight="700" fill="#a43543" text-anchor="middle">Loss against clean target</text>
<text x="875.0" y="726.5" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">MSE(reconstructed, clean)</text>
<path d="M 875,565 L 875,645" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 200,230 L 200,702 L 690,702" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="325" y="648" font-size="22" font-weight="400" fill="#245b93" text-anchor="start">The original supplies the target.</text>
<text x="325" y="681" font-size="21" font-weight="400" fill="#4c6076" text-anchor="start">No added noise on this branch.</text>
<rect x="700" y="830" width="350" height="95" rx="13" fill="#fcecf0" stroke="#a43543" stroke-width="1.6"/>
<text x="875.0" y="869.5" font-size="22" font-weight="700" fill="#a43543" text-anchor="middle">Backpropagation: gradients</text>
<text x="875.0" y="901.5" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">error.backward()</text>
<path d="M 875,760 L 875,820" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="300" y="830" width="320" height="95" rx="13" fill="#f1ecf9" stroke="#7351a0" stroke-width="1.6"/>
<text x="460.0" y="869.5" font-size="22" font-weight="700" fill="#7351a0" text-anchor="middle">Update weights and biases</text>
<text x="460.0" y="901.5" font-size="22" font-weight="400" fill="#192c43" text-anchor="middle">optimizer.step()</text>
<path d="M 690,877 L 630,877" fill="none" stroke="#59718a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 300,855 L 270,855 L 270,450 L 325,450 L 325,510 L 355,510" fill="none" stroke="#7351a0" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#update)"/>
<path d="M 270,450 L 270,245 L 750,245 L 750,310" fill="none" stroke="#7351a0" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#update)"/>
<text x="50" y="965" font-size="23" font-weight="700" fill="#192c43" text-anchor="start">Denoising is learned by repeatedly training on this input–target relationship.</text>
</svg>