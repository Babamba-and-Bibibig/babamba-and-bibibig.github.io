<text x="550.0" y="842.0" font-size="24" font-weight="700" fill="#15715d" text-anchor="middle">torch.cat(results, dim=0)</text>
<text x="550.0" y="874.0" font-size="24" font-weight="400" fill="#192c43" text-anchor="middle">복원 전체: (600, 1, 28, 28)</text>
<text x="550" y="951" font-size="23" font-weight="700" fill="#192c43" text-anchor="middle">기존 이미지 축을 따라 연결한다. 새 축을 만들거나 픽셀을 합산하지 않는다.</text>
