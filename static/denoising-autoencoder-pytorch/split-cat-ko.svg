<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">split → model → cat: 이미지 순서를 유지한다</title>
<desc id="desc">설명용600장을256장,256장,88장으로 나누고 같은 모델을 순서대로 호출한다. 각 출력은 원래 이미지 인덱스를 유지한다. cat dim0으로 다시600장의 텐서가 된다.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10 Z" fill="#59718a"/></marker><marker id="update" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10 Z" fill="#7351a0"/></marker></defs>
<style>text{font-family:"Pretendard","Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","DejaVu Sans",sans-serif} .code{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1100" height="1000" rx="18" fill="#f5f7fb"/>
<text x="38" y="53" font-size="32" font-weight="700" fill="#192c43" text-anchor="start">split → model → cat: 이미지 순서를 유지한다</text>
<text x="38" y="92" font-size="21" font-weight="400" fill="#4c6076" text-anchor="start">600장은 설명을 위한 예시다. 실제 검증 이미지 수는 데이터에서 확인한다.</text>
<rect x="100" y="135" width="900" height="90" rx="13" fill="#eaf3fc" stroke="#245b93" stroke-width="1.6"/>
<text x="550.0" y="172.0" font-size="24" font-weight="700" fill="#245b93" text-anchor="middle">잡음 이미지 noisy: (600, 1, 28, 28)</text>
<text x="550.0" y="204.0" font-size="24" font-weight="400" fill="#192c43" text-anchor="middle">noisy.split(256, dim=0)</text>
