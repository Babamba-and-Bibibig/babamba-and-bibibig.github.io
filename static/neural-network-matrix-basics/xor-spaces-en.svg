<text x="394" y="408" fill="#52627b" font-size="15" font-weight="400" text-anchor="middle" xml:space="preserve">0</text>
<text x="377" y="387" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">0</text>
<line x1="486.5" y1="166" x2="486.5" y2="391" stroke="#e2e8f0" stroke-width="1"/>
<line x1="380" y1="289.5" x2="615" y2="289.5" stroke="#e2e8f0" stroke-width="1"/>
<line x1="579" y1="166" x2="579" y2="391" stroke="#e2e8f0" stroke-width="1"/>
<line x1="380" y1="197" x2="615" y2="197" stroke="#e2e8f0" stroke-width="1"/>
<text x="579" y="408" fill="#52627b" font-size="15" font-weight="400" text-anchor="middle" xml:space="preserve">1</text>
<text x="377" y="202" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">1</text>
<line x1="380" y1="382" x2="616" y2="382" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="394" y1="395" x2="394" y2="164" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="621" y="409" fill="#16243b" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">h1</text>
<text x="393" y="162" fill="#16243b" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">h2</text>
<line x1="58.05" y1="302.45" x2="185.7" y2="174.79999999999998" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="150.55" y1="394.95" x2="278.20000000000005" y2="267.3" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="381.05" y1="276.55" x2="499.45" y2="394.95" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="71" cy="382" r="7" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
