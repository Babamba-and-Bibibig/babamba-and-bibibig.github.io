<line x1="64" y1="190" x2="78" y2="204" stroke="#b45309" stroke-width="3"/>
<line x1="78" y1="190" x2="64" y2="204" stroke="#b45309" stroke-width="3"/>
<text x="84" y="189" fill="#b45309" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">1</text>
<line x1="249" y1="375" x2="263" y2="389" stroke="#b45309" stroke-width="3"/>
<line x1="263" y1="375" x2="249" y2="389" stroke="#b45309" stroke-width="3"/>
<text x="268" y="370" fill="#b45309" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">2</text>
