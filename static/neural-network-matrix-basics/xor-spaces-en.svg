<text x="268" y="189" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">3</text>
<circle cx="394" cy="382" r="12" fill="white" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="394" cy="382" r="7" fill="#1d4ed8" stroke="white" stroke-width="1.5"/>
<text x="410" y="367" fill="#1d4ed8" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">0, 3</text>
<line x1="387" y1="190" x2="401" y2="204" stroke="#b45309" stroke-width="3"/>
<line x1="401" y1="190" x2="387" y2="204" stroke="#b45309" stroke-width="3"/>
<text x="407" y="189" fill="#b45309" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">1</text>
<line x1="572" y1="375" x2="586" y2="389" stroke="#b45309" stroke-width="3"/>
<line x1="586" y1="375" x2="572" y2="389" stroke="#b45309" stroke-width="3"/>
<text x="591" y="370" fill="#b45309" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">2</text>
<text x="178" y="468" fill="#6d28d9" font-size="19" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">x2 = x1 ± 0.5</text>
<text x="501" y="468" fill="#6d28d9" font-size="19" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">h1 + h2 = 0.5</text>
<rect x="28" y="493" width="624" height="87" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="47" y="522" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">Point labels are sample indices. Samples 0 and 3 overlap in H.</text>
<text x="47" y="551" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">There are three visible locations, but still four samples.</text>
<circle cx="43" cy="614" r="7" fill="#1d4ed8"/>
<text x="61" y="620" fill="#16243b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">Class 0: same</text>
<line x1="270" y1="607" x2="284" y2="621" stroke="#b45309" stroke-width="3"/>
<line x1="284" y1="607" x2="270" y2="621" stroke="#b45309" stroke-width="3"/>
<text x="295" y="620" fill="#16243b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">Class 1: different</text>
<text x="28" y="669" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">Dashed lines mark equal class scores. Labels and classes stay the same.</text>
<text x="28" y="694" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">The threshold 0.5 follows from this example&#x27;s fixed weights and biases.</text>
</svg>
