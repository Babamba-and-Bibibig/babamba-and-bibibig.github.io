<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The same samples in two coordinate systems</title><desc id="desc">X has four input points. In H, samples 0 and 3 share (0,0). The two boundaries in input coordinates become one line in hidden coordinates.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Noto Sans CJK KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums} .num{font-family:ui-monospace,SFMono-Regular,Consolas,"DejaVu Sans Mono",monospace}</style>
<rect width="680" height="720" rx="18" fill="#f6f8fc"/>
<text x="28" y="41" fill="#16243b" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">The same samples in two coordinate systems</text>
<text x="28" y="77" fill="#52627b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">X stays unchanged; H contains newly calculated values.</text>
<rect x="30" y="110" width="297" height="328" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="178" y="142" fill="#1d4ed8" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve">X</text>
<line x1="71" y1="166" x2="71" y2="391" stroke="#e2e8f0" stroke-width="1"/>
<line x1="57" y1="382" x2="292" y2="382" stroke="#e2e8f0" stroke-width="1"/>
<text x="71" y="408" fill="#52627b" font-size="15" font-weight="400" text-anchor="middle" xml:space="preserve">0</text>
<text x="54" y="387" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">0</text>
<line x1="163.5" y1="166" x2="163.5" y2="391" stroke="#e2e8f0" stroke-width="1"/>
<line x1="57" y1="289.5" x2="292" y2="289.5" stroke="#e2e8f0" stroke-width="1"/>
<line x1="256" y1="166" x2="256" y2="391" stroke="#e2e8f0" stroke-width="1"/>
<line x1="57" y1="197" x2="292" y2="197" stroke="#e2e8f0" stroke-width="1"/>
<text x="256" y="408" fill="#52627b" font-size="15" font-weight="400" text-anchor="middle" xml:space="preserve">1</text>
<text x="54" y="202" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">1</text>
<line x1="57" y1="382" x2="293" y2="382" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="71" y1="395" x2="71" y2="164" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="298" y="409" fill="#16243b" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">x1</text>
<text x="70" y="162" fill="#16243b" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">x2</text>
<rect x="353" y="110" width="297" height="328" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="501" y="142" fill="#0f766e" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve">H</text>
