<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">One row and one column produce one cell</title><desc id="desc">Pair row 1 of X with column 1 of W1. Multiply matching entries and add them to get Z1[1,1] = 1.</desc>
