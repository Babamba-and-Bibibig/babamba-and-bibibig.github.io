<svg xmlns="http://www.w3.org/2000/svg" width="680" height="695" viewBox="0 0 680 695" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Add the same two biases to every sample row</title><desc id="desc">Add b2=[1,0] to each row of H @ W2. The first column receives 1 and the second receives 0, yielding S.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
