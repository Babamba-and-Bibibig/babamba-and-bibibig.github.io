<text x="48" y="475" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve" class="num">b2.shape = (2,)</text>
<text x="48" y="510" fill="#16243b" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve">First column: −1 + 1 = 0    Second: 1 + 0 = 1</text>
