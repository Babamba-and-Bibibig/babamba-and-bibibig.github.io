<text x="28" y="619" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">Broadcasting determines how arrays with different shapes align.</text>
<text x="28" y="644" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">Here, the same two b2 values apply to every row.</text>
<text x="28" y="669" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">No separate array with four copies of b2 needs to be created.</text>
