<svg xmlns="http://www.w3.org/2000/svg" width="680" height="906" viewBox="0 0 680 906" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">keepdims=True는 행마다 기준값 한 칸을 남긴다</title><desc id="desc">별도 점수 예제 scores3의 크기는 (2,3)이다. axis=1로 최댓값을 구하고 keepdims=True로 (2,1)을 유지한다. 각 행은 자신의 최댓값 5.0 또는 4.2를 뺀다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Noto Sans CJK KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums} .num{font-family:ui-monospace,SFMono-Regular,Consolas,"DejaVu Sans Mono",monospace}</style>
<rect width="680" height="906" rx="18" fill="#f6f8fc"/>
<text x="28" y="41" fill="#16243b" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">keepdims=True는 행마다 기준값 한 칸을 남긴다</text>
<text x="28" y="77" fill="#52627b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">행마다 다른 최댓값을 갖는 별도 점수 예제로 방향을 확인한다.</text>
<text x="181" y="134" fill="#1d4ed8" font-size="22" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">scores3 (2, 3)</text>
<text x="518" y="134" fill="#b45309" font-size="21" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">row_max3 (2, 1)</text>
<rect x="58" y="190" width="82" height="52" rx="0" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
<text x="99.0" y="224.05" fill="#1d4ed8" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">2.1</text>
<rect x="140" y="190" width="82" height="52" rx="0" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
<text x="181.0" y="224.05" fill="#1d4ed8" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">0.4</text>
<rect x="222" y="190" width="82" height="52" rx="0" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
<text x="263.0" y="224.05" fill="#1d4ed8" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">5.0</text>
<text x="46" y="222.0" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">0</text>
<rect x="58" y="242" width="82" height="52" rx="0" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1"/>
<text x="99.0" y="276.05" fill="#0f766e" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">1.3</text>
<rect x="140" y="242" width="82" height="52" rx="0" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1"/>
<text x="181.0" y="276.05" fill="#0f766e" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">4.2</text>
<rect x="222" y="242" width="82" height="52" rx="0" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1"/>
<text x="263.0" y="276.05" fill="#0f766e" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">0.7</text>
<text x="46" y="274.0" fill="#52627b" font-size="15" font-weight="400" text-anchor="end" xml:space="preserve">1</text>
<text x="99.0" y="178" fill="#52627b" font-size="16" font-weight="400" text-anchor="middle" xml:space="preserve">0</text>
<text x="181.0" y="178" fill="#52627b" font-size="16" font-weight="400" text-anchor="middle" xml:space="preserve">1</text>
<text x="263.0" y="178" fill="#52627b" font-size="16" font-weight="400" text-anchor="middle" xml:space="preserve">2</text>
<rect x="477" y="190" width="82" height="52" rx="0" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1"/>
<text x="518.0" y="224.05" fill="#1d4ed8" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">5.0</text>
<rect x="477" y="242" width="82" height="52" rx="0" fill="#ccfbf1" stroke="#cbd5e1" stroke-width="1"/>
<text x="518.0" y="276.05" fill="#0f766e" font-size="23" font-weight="700" text-anchor="middle" xml:space="preserve" class="num">4.2</text>
<line x1="320" y1="216" x2="458" y2="216" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="268" x2="458" y2="268" stroke="#52627b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="389" y="174" fill="#b45309" font-size="17" font-weight="700" text-anchor="middle" xml:space="preserve">max</text>
<text x="28" y="340" fill="#52627b" font-size="19" font-weight="400" text-anchor="start" xml:space="preserve" class="num">row_max3 = scores3.max(axis=1, keepdims=True)</text>
<rect x="28" y="367" width="624" height="84" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="396" fill="#52627b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">axis=1: 각 행 안의 점수 3개를 최댓값 하나로 줄인다.</text>
<text x="46" y="424" fill="#52627b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">keepdims=True: 줄어든 두 번째 축을 크기 1로 유지한다.</text>
<text x="28" y="497" fill="#16243b" font-size="22" font-weight="700" text-anchor="start" xml:space="preserve">각 행은 자신의 최댓값을 뺀다</text>
<rect x="28" y="520" width="624" height="111" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="46" y="550" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve">행 0</text>
<text x="46" y="585" fill="#16243b" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="num">[2.1 − 5.0, 0.4 − 5.0, 5.0 − 5.0]</text>
<text x="46" y="615" fill="#1d4ed8" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve" class="num">= [−2.9, −4.6, 0.0]</text>
<rect x="28" y="653" width="624" height="111" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="1"/>
<text x="46" y="683" fill="#0f766e" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve">행 1</text>
<text x="46" y="718" fill="#16243b" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="num">[1.3 − 4.2, 4.2 − 4.2, 0.7 − 4.2]</text>
<text x="46" y="748" fill="#0f766e" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve" class="num">= [−2.9, 0.0, −3.5]</text>
<text x="28" y="813" fill="#6d28d9" font-size="23" font-weight="700" text-anchor="start" xml:space="preserve" class="num">(2, 3) − (2, 1) → (2, 3)</text>
<text x="28" y="855" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">크기 (2, 1)의 한 칸은 같은 행의 세 열에 적용된다.</text>
<text x="28" y="880" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">행마다 계산한 기준값을 다른 샘플의 행과 섞지 않는다.</text>
</svg>
