<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Use y to select one true-class cell from each row</title><desc id="desc">Pair row indices [0,1,2,3] with targets [0,1,1,0]. Each selected probability is about 0.7311 and each loss about 0.3133.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Noto Sans CJK KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums} .num{font-family:ui-monospace,SFMono-Regular,Consolas,"DejaVu Sans Mono",monospace}</style>
<rect width="680" height="800" rx="18" fill="#f6f8fc"/>
<text x="28" y="41" fill="#16243b" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">Use y to select one true-class cell from each row</text>
<text x="28" y="79" fill="#52627b" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="num">correct_p = probabilities[row_indices, y]</text>
