<rect x="28" y="580" width="624" height="129" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
<text x="46" y="611" fill="#6d28d9" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve" class="num">correct_p ≈ [0.7311, 0.7311, 0.7311, 0.7311]</text>
<text x="46" y="649" fill="#16243b" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve" class="num">−log → [0.3133, 0.3133, 0.3133, 0.3133]</text>
<text x="46" y="686" fill="#6d28d9" font-size="21" font-weight="700" text-anchor="start" xml:space="preserve">Mean of the four losses ≈ 0.3133</text>
<text x="28" y="749" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">Use y to evaluate the true class. pred is the predicted class.</text>
<text x="28" y="774" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">For incorrect predictions, the two indices select different cells.</text>
