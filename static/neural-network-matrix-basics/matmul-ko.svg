<rect x="28" y="434" width="624" height="101" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="46" y="465" fill="#16243b" font-size="20" font-weight="400" text-anchor="start" xml:space="preserve" class="num">Z1[1, 1] = 0 × (−1) + 1 × 1 + 0</text>
<text x="46" y="506" fill="#0f766e" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve" class="num">             = 0 + 1 + 0 = 1</text>
<text x="28" y="569" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">왼쪽의 특징 2개와 오른쪽의 가중치 2개가 순서대로 짝을 이룬다.</text>
<text x="28" y="594" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">다른 칸도 같은 방법으로 계산한다. (4, 2) @ (2, 2) → (4, 2)</text>
