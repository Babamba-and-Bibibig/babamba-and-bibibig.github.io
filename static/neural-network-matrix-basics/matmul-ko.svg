<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">한 행과 한 열을 계산하면 결과 한 칸이 된다</title><desc id="desc">X의 행 번호 1과 W1의 열 번호 1을 선택한다. 같은 순서의 숫자를 곱해 더하면 Z1의 행 1, 열 1 값인 1이 된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Noto Sans KR","Noto Sans CJK KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums} .num{font-family:ui-monospace,SFMono-Regular,Consolas,"DejaVu Sans Mono",monospace}</style>
<rect width="680" height="620" rx="18" fill="#f6f8fc"/>
<text x="28" y="41" fill="#16243b" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">한 행과 한 열을 계산하면 결과 한 칸이 된다</text>
<text x="28" y="75" fill="#52627b" font-size="17" font-weight="400" text-anchor="start" xml:space="preserve">행·열 번호는 0부터 시작한다. b1 = [0, 0]이다.</text>
