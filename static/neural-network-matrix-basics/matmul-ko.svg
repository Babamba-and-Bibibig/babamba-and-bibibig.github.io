<text x="336" y="122" fill="#b45309" font-size="24" font-weight="700" text-anchor="middle" xml:space="preserve">W1</text>
<text x="336" y="149" fill="#52627b" font-size="17" font-weight="400" text-anchor="middle" xml:space="preserve" class="num">(2, 2)</text>
<text x="568" y="122" fill="#0f766e" font-size="24" font-weight="700" text-anchor="middle" xml:space="preserve">Z1</text>
<text x="568" y="149" fill="#52627b" font-size="17" font-weight="400" text-anchor="middle" xml:space="preserve" class="num">(4, 2)</text>
