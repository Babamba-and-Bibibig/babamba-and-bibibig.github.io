<text x="496" y="414" fill="#52627b" font-size="17" font-weight="400" text-anchor="middle" xml:space="preserve">가중합 + 편향</text>
<rect x="28" y="443" width="624" height="134" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1"/>
<text x="48" y="475" fill="#1d4ed8" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve" class="num">b2.shape = (2,)</text>
<text x="48" y="510" fill="#16243b" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve">첫 열: −1 + 1 = 0     둘째 열: 1 + 0 = 1</text>
<text x="48" y="548" fill="#0f766e" font-size="21" font-weight="700" text-anchor="start" xml:space="preserve" class="num">(4, 2) + (2,) → (4, 2)</text>
<text x="28" y="619" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">이렇게 크기가 다른 배열의 대응 위치를 맞추는 규칙이 브로드캐스팅이다.</text>
<text x="28" y="644" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">여기서는 b2의 같은 두 값을 모든 행에 적용한다.</text>
<text x="28" y="669" fill="#52627b" font-size="16" font-weight="400" text-anchor="start" xml:space="preserve">b2를 실제로 네 번 복사한 배열을 미리 만들 필요는 없다.</text>
</svg>
