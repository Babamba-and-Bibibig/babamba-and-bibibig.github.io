<text x="28" y="41" fill="#16243b" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">편향 두 개를 모든 샘플 행에 똑같이 더한다</text>
<text x="28" y="76" fill="#52627b" font-size="21" font-weight="400" text-anchor="start" xml:space="preserve" class="num">S = H @ W2 + b2</text>
