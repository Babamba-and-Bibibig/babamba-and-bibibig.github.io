<svg xmlns="http://www.w3.org/2000/svg" width="680" height="695" viewBox="0 0 680 695" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">편향 두 개를 모든 샘플 행에 똑같이 더한다</title><desc id="desc">H @ W2의 각 행에 b2=[1,0]을 더한다. 첫 열에는 1, 둘째 열에는 0을 더한 결과가 S다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
