<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1135" viewBox="0 0 1000 1135" role="img" aria-labelledby="title desc" lang="en">
<title id="title">An index is meaningful only within its dataset</title>
<desc id="desc">In this illustrative example, the selected indices start with [5220, …]. train_set[0] requests merged_dataset[5220], which maps past 5,216 preceding samples to original_val[4]. ImageFolder.samples stores paths and labels; dataset[i] loads and transforms an image before returning it with its label.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#59718a"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}</style>
<rect width="1000" height="1135" rx="16" fill="#f5f7fb"/>
<text x="36" y="49" font-size="29" fill="#172033" font-weight="700" text-anchor="start" data-width="928">An index is meaningful only within its dataset</text>
<text x="36" y="84" font-size="19" fill="#46566c" font-weight="400" text-anchor="start" data-width="928">A Subset connects selected indices to an existing dataset without copying image files.</text>
<rect x="40" y="125" width="440" height="100" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="260.0" y="167.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">original_train · 5,216 samples</text>
<text x="260.0" y="198.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">Local sample indices: 0–5215</text>
<rect x="520" y="125" width="440" height="100" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="740.0" y="167.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">original_val · 16 samples</text>
<text x="740.0" y="198.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">Local sample indices: 0–15</text>
<path d="M260 233 V255 H500 V277" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M740 233 V255 H500" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round"/>
<rect x="40" y="287" width="920" height="110" rx="12" fill="#edf1f6" stroke="#59718a" stroke-width="1.6"/>
<text x="500.0" y="319.0" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="890">merged_dataset · ConcatDataset</text>
<text x="500.0" y="350.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="890">0–5215 → original_train / 5216–5231 → original_val</text>
<text x="500.0" y="381.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="890">The order and lengths of the underlying datasets determine the mapping.</text>
<rect x="40" y="435" width="920" height="80" rx="12" fill="#ffffff" stroke="#59718a" stroke-width="1.6"/>
<text x="500.0" y="467.5" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="890">Illustrative example: train_idx = [5220, …]</text>
<text x="500.0" y="498.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="890">This does not claim that the real split selected 5220 first.</text>
<rect x="70" y="555" width="410" height="80" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="275.0" y="587.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="380">train_set[0]</text>
<text x="275.0" y="618.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="380">Sample index 0 within the Subset</text>
<path d="M275 643 V675" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="70" y="685" width="410" height="80" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="275.0" y="717.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="380">merged_dataset[5220]</text>
<text x="275.0" y="748.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="380">Underlying index read from train_idx[0]</text>
<path d="M275 773 V805" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="70" y="815" width="410" height="80" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="275.0" y="847.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="380">original_val[4]</text>
<text x="275.0" y="878.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="380">5,220 − 5,216 preceding samples = 4</text>
<text x="530" y="585" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">A Subset stores the underlying dataset</text>
<text x="530" y="616" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">together with its selected indices.</text>
<text x="530" y="715" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">Apply every index to the same dataset</text>
<text x="530" y="746" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">whose ordering defined that index.</text>
<text x="530" y="845" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">ImageFolder reads the file and</text>
<text x="530" y="876" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="420">runs the configured transform.</text>
<text x="40" y="953" font-size="23" fill="#172033" font-weight="700" text-anchor="start" data-width="920">Stored metadata and returned data are different</text>
<rect x="40" y="981" width="440" height="112" rx="12" fill="#ffffff" stroke="#59718a" stroke-width="1.6"/>
<text x="260.0" y="1014.0" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">original_val.samples[4]</text>
<text x="260.0" y="1045.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">(path string, class label)</text>
<text x="260.0" y="1076.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">This lookup does not read the pixels.</text>
<rect x="520" y="981" width="440" height="112" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="740.0" y="1014.0" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">original_val[4]</text>
<text x="740.0" y="1045.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">(transformed image, class label)</text>
<text x="740.0" y="1076.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">Loading and transforms run on access.</text>
</svg>
