<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1085" viewBox="0 0 1000 1085" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Training, validation, and test have different roles</title>
<desc id="desc">Combine the original 5,216 training and 16 validation images. A stratified split produces 4,185 training and 1,047 validation images. Training updates weights; validation guides model selection. Keep the 624 test images separate until the model is selected.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#59718a"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}</style>
<rect width="1000" height="1085" rx="16" fill="#f5f7fb"/>
<text x="36" y="49" font-size="29" fill="#172033" font-weight="700" text-anchor="start" data-width="928">Training, validation, and test have different roles</text>
<text x="36" y="84" font-size="19" fill="#46566c" font-weight="400" text-anchor="start" data-width="928">Splitting assigns samples to a purpose; it does not change their pixels.</text>
<rect x="50" y="125" width="540" height="106" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="320.0" y="170.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="510">Original train 5,216 + val 16</text>
<text x="320.0" y="201.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="510">5,232 images · verify the class mapping</text>
<rect x="665" y="125" width="285" height="106" rx="12" fill="#edf1f6" stroke="#59718a" stroke-width="1.6"/>
<text x="807.5" y="170.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="255">Original test: 624</text>
<text x="807.5" y="201.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="255">Keep separate</text>
<path d="M320 239 V267" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="277" width="540" height="100" rx="12" fill="#ffffff" stroke="#59718a" stroke-width="1.6"/>
<text x="320.0" y="319.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="510">Stratified split: 80% / 20%</text>
<text x="320.0" y="350.5" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="510">Keep similar NORMAL / PNEUMONIA ratios</text>
<path d="M320 385 V407 H250 V430" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M320 407 H725 V430" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="440" width="400" height="116" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="250.0" y="475.0" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="370">New training: 4,185</text>
<text x="250.0" y="506.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="370">NORMAL 1,079 · PNEUMONIA 3,106</text>
<text x="250.0" y="537.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="370">Used to update weights</text>
<rect x="500" y="440" width="450" height="116" rx="12" fill="#fcebee" stroke="#b93745" stroke-width="1.6"/>
<text x="725.0" y="475.0" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="420">New validation: 1,047</text>
<text x="725.0" y="506.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="420">NORMAL 270 · PNEUMONIA 777</text>
<text x="725.0" y="537.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="420">Used to choose the model and settings</text>
<path d="M250 564 V592" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M725 564 V592" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="602" width="400" height="125" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="250.0" y="641.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="370">One training batch</text>
<text x="250.0" y="672.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="370">Prediction → loss → backward</text>
<text x="250.0" y="703.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="370">optimizer.step() updates weights</text>
<rect x="500" y="602" width="450" height="125" rx="12" fill="#fcebee" stroke="#b93745" stroke-width="1.6"/>
<text x="725.0" y="641.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="420">One validation pass</text>
<text x="725.0" y="672.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="420">eval() + no_grad()</text>
<text x="725.0" y="703.5" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="420">Compute metrics without weight updates</text>
<path d="M250 735 V765 H500 V787" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M725 735 V765 H500" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round"/>
<rect x="230" y="797" width="540" height="83" rx="12" fill="#ffffff" stroke="#59718a" stroke-width="1.6"/>
<text x="500.0" y="846.5" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="510">Select the model using validation results</text>
<path d="M500 888 V920 H725 V940" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="500" y="950" width="450" height="83" rx="12" fill="#edf1f6" stroke="#59718a" stroke-width="1.6"/>
<text x="725.0" y="999.5" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="420">Evaluate 624 test images after selection</text>
<path d="M958 178 H978 V992 H960" fill="none" stroke="#59718a" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="50" y="993" font-size="19" fill="#46566c" font-weight="400" text-anchor="start" data-width="420">Dashed line: held-out test data</text>
<text x="50" y="1061" font-size="19" fill="#172033" font-weight="400" text-anchor="start" data-width="900">Repeatedly tuning against test results turns the test set into model-selection data.</text>
</svg>
