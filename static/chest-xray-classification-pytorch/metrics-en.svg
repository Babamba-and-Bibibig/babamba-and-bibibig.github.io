<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Recall and precision use different denominators</title>
<desc id="desc">These are supplied validation results for the Partial model, not a newly run experiment. Rows are true labels and columns are predictions: [[252,18],[16,761]]. NORMAL recall is 252/270, PNEUMONIA recall is 761/777, and PNEUMONIA precision is 761/779. The model classified 1,013 of 1,047 images correctly.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#59718a"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}</style>
<rect width="1000" height="1090" rx="16" fill="#f5f7fb"/>
<text x="36" y="49" font-size="29" fill="#172033" font-weight="700" text-anchor="start" data-width="928">Recall and precision use different denominators</text>
<text x="36" y="84" font-size="19" fill="#46566c" font-weight="400" text-anchor="start" data-width="928">Supplied validation record for the Partial model; not a newly trained result.</text>
<text x="470" y="151" font-size="23" fill="#172033" font-weight="700" text-anchor="middle" data-width="600">Columns: predicted class</text>
<text x="360" y="205" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="240">NORMAL</text>
<text x="600" y="205" font-size="22" fill="#172033" font-weight="700" text-anchor="middle" data-width="240">PNEUMONIA</text>
<text x="840" y="184" font-size="20" fill="#172033" font-weight="700" text-anchor="middle" data-width="200">True-label</text>
<text x="840" y="214" font-size="20" fill="#172033" font-weight="700" text-anchor="middle" data-width="200">image totals</text>
<text x="40" y="265" font-size="19" fill="#172033" font-weight="700" text-anchor="start" data-width="185">Rows: true class</text>
<text x="40" y="322" font-size="20" fill="#172033" font-weight="700" text-anchor="start" data-width="185">NORMAL</text>
<text x="40" y="462" font-size="20" fill="#172033" font-weight="700" text-anchor="start" data-width="185">PNEUMONIA</text>
<rect x="240" y="240" width="240" height="140" rx="0" fill="#e5f3ec" stroke="#216951" stroke-width="1.6"/>
<text x="360" y="325" font-size="48" fill="#216951" font-weight="700" text-anchor="middle" data-width="210">252</text>
<rect x="480" y="240" width="240" height="140" rx="0" fill="#fcebee" stroke="#b93745" stroke-width="1.6"/>
<text x="600" y="325" font-size="48" fill="#b93745" font-weight="700" text-anchor="middle" data-width="210">18</text>
<rect x="240" y="380" width="240" height="140" rx="0" fill="#fcebee" stroke="#b93745" stroke-width="1.6"/>
<text x="360" y="465" font-size="48" fill="#b93745" font-weight="700" text-anchor="middle" data-width="210">16</text>
<rect x="480" y="380" width="240" height="140" rx="0" fill="#e5f3ec" stroke="#216951" stroke-width="1.6"/>
<text x="600" y="465" font-size="48" fill="#216951" font-weight="700" text-anchor="middle" data-width="210">761</text>
<text x="840" y="325" font-size="29" fill="#172033" font-weight="700" text-anchor="middle" data-width="170">270</text>
<text x="840" y="465" font-size="29" fill="#172033" font-weight="700" text-anchor="middle" data-width="170">777</text>
<text x="40" y="566" font-size="19" fill="#172033" font-weight="700" text-anchor="start" data-width="190">Prediction totals</text>
<text x="360" y="566" font-size="26" fill="#172033" font-weight="700" text-anchor="middle" data-width="220">268</text>
<text x="600" y="566" font-size="26" fill="#172033" font-weight="700" text-anchor="middle" data-width="220">779</text>
<text x="840" y="566" font-size="24" fill="#172033" font-weight="700" text-anchor="middle" data-width="200">Total 1,047</text>
<rect x="40" y="628" width="440" height="138" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="260.0" y="674.0" font-size="23" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">NORMAL recall</text>
<text x="260.0" y="705.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">252 correct out of 270 true NORMAL</text>
<text x="260.0" y="736.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">252 / 270 = 93.33%</text>
<rect x="520" y="628" width="440" height="138" rx="12" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.6"/>
<text x="740.0" y="674.0" font-size="23" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">PNEUMONIA recall</text>
<text x="740.0" y="705.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">761 correct out of 777 true PNEUMONIA</text>
<text x="740.0" y="736.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">761 / 777 = 97.94%</text>
<rect x="40" y="801" width="440" height="138" rx="12" fill="#fcebee" stroke="#b93745" stroke-width="1.6"/>
<text x="260.0" y="847.0" font-size="23" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">PNEUMONIA precision</text>
<text x="260.0" y="878.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">761 correct out of 779 predicted positive</text>
<text x="260.0" y="909.0" font-size="19" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">761 / 779 = 97.69%</text>
<rect x="520" y="801" width="440" height="138" rx="12" fill="#e5f3ec" stroke="#216951" stroke-width="1.6"/>
<text x="740.0" y="847.0" font-size="23" fill="#172033" font-weight="700" text-anchor="middle" data-width="410">Overall accuracy</text>
<text x="740.0" y="878.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">1,013 correct out of all 1,047 images</text>
<text x="740.0" y="909.0" font-size="20" fill="#46566c" font-weight="400" text-anchor="middle" data-width="410">1,013 / 1,047 = 96.75%</text>
<text x="40" y="996" font-size="21" fill="#1b5fa7" font-weight="700" text-anchor="start" data-width="920">Recall starts from images whose true label is the target class.</text>
<text x="40" y="1036" font-size="21" fill="#b93745" font-weight="700" text-anchor="start" data-width="920">Precision starts from images predicted as the target class.</text>
</svg>
