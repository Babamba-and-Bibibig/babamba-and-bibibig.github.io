<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 655" width="560" height="655" role="img" aria-labelledby="title desc">
<title id="title">Flip the image and its mask together</title><desc id="desc">Two balls of different sizes show why an image flip must use the same flip for its class-ID mask.</desc>
<style>text{font-family:"Noto Sans CJK KR",Arial,sans-serif} .mono{font-family:monospace}</style>
<rect x="0" y="0" width="560" height="655" rx="14" fill="#fcfbf8" stroke="none"/>
<text x="24" y="38" font-size="25" font-weight="700" fill="#20232b" text-anchor="start">Flip the image and its mask together</text>
<text x="134" y="75" font-size="22" font-weight="400" fill="#20232b" text-anchor="middle">Image</text>
<text x="414" y="75" font-size="22" font-weight="400" fill="#20232b" text-anchor="middle">Target mask</text>
<image x="24" y="94" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="94" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<image x="304" y="94" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="304" y="94" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="280" y="252" font-size="21" font-weight="700" fill="#20232b" text-anchor="middle">Original pair</text>
<image x="24" y="268" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="268" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<image x="304" y="268" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="304" y="268" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="280" y="426" font-size="21" font-weight="700" fill="#236a4b" text-anchor="middle">Same flip → correspondence preserved</text>
<image x="24" y="442" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="442" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<image x="304" y="442" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="304" y="442" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="280" y="600" font-size="21" font-weight="700" fill="#b92b3e" text-anchor="middle">Image only → target no longer matches</text>
<text x="280" y="637" font-size="18" font-weight="400" fill="#596171" text-anchor="middle">Make one flip decision and apply it to both arrays.</text>
</svg>
