<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 644" width="560" height="644" role="img" aria-labelledby="title desc">
<title id="title">같은 픽셀, 서로 다른 저장 값</title><desc id="desc">RGB, semantic class IDs, and connected-region labels for two separated circles.</desc>
<style>text{font-family:"Noto Sans CJK KR",Arial,sans-serif} .mono{font-family:monospace}</style>
<rect x="0" y="0" width="560" height="644" rx="14" fill="#fcfbf8" stroke="none"/>
<text x="24" y="38" font-size="26" font-weight="700" fill="#20232b" text-anchor="start">같은 픽셀, 서로 다른 저장 값</text>
<text x="24" y="75" font-size="23" font-weight="700" fill="#20232b" text-anchor="start">01  RGB 이미지</text>
<image x="24" y="90" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="90" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="265" y="120" font-size="20" font-weight="700" fill="#20232b" text-anchor="start" class="mono">(120, 200, 3)</text>
<text x="265" y="158" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">픽셀마다 색상 값 3개</text>
<text x="265" y="189" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">[230, 60, 50]</text>
<text x="24" y="255" font-size="23" font-weight="700" fill="#20232b" text-anchor="start">02  시맨틱 마스크</text>
<image x="24" y="270" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="270" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="265" y="300" font-size="20" font-weight="700" fill="#20232b" text-anchor="start" class="mono">(120, 200)</text>
<text x="265" y="338" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">0 하늘 · 1 땅 · 2 공</text>
<text x="265" y="369" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">두 공 모두 클래스 2</text>
<text x="37.2" y="297.0" font-size="19" font-weight="700" fill="#20232b" text-anchor="middle">0</text>
<text x="37.2" y="390.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="84.5" y="341.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="183.5" y="341.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="24" y="435" font-size="23" font-weight="700" fill="#20232b" text-anchor="start">03  연결 영역 번호</text>
<image x="24" y="450" width="220.00000000000003" height="132.0" preserveAspectRatio="none" style="image-rendering:pixelated" xlink:href="data:image/png;base64,"/>
<rect x="24" y="450" width="220.00000000000003" height="132.0" rx="0" fill="none" stroke="#dcdfe4"/>
<text x="265" y="480" font-size="20" font-weight="700" fill="#20232b" text-anchor="start" class="mono">(120, 200)</text>
<text x="265" y="518" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">0 공 이외의 영역</text>
<text x="265" y="549" font-size="19" font-weight="400" fill="#20232b" text-anchor="start">1·2 서로 다른 공 영역</text>
<text x="84.5" y="521.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="183.5" y="521.0" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<line x1="24" y1="606" x2="536" y2="606" stroke="#dcdfe4" stroke-width="1"/>
<text x="24" y="633" font-size="19" font-weight="400" fill="#596171" text-anchor="start">표시 색과 마스크에 저장된 숫자는 다르다.</text>
</svg>
