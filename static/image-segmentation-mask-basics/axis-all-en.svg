<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 600" width="560" height="600" role="img" aria-labelledby="title desc">
<title id="title">From channel comparisons to pixels</title><desc id="desc">An all-reduction over RGB gives one boolean result per pixel; two independent example pixels are shown.</desc>
<style>text{font-family:"Noto Sans CJK KR",Arial,sans-serif} .mono{font-family:monospace}</style>
<rect x="0" y="0" width="560" height="600" rx="14" fill="#fcfbf8" stroke="none"/>
<text x="24" y="38" font-size="26" font-weight="700" fill="#20232b" text-anchor="start">From channel comparisons to pixels</text>
<text x="24" y="75" font-size="20" font-weight="400" fill="#20232b" text-anchor="start" class="mono">result: (120, 200, 3)  →  ball: (120, 200)</text>
<text x="24" y="108" font-size="18" font-weight="400" fill="#596171" text-anchor="start">Two separate example pixels show the comparison.</text>
<rect x="24" y="134" width="512" height="148" rx="10" fill="#ffffff" stroke="#dcdfe4"/>
<rect x="42" y="153" width="26" height="26" rx="4" fill="rgb(230, 60, 50)" stroke="none"/>
<text x="82" y="176" font-size="22" font-weight="700" fill="#20232b" text-anchor="start" class="mono">[230, 60, 50]</text>
<text x="42" y="211" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">R == 230</text>
<text x="195" y="211" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">G == 60</text>
<text x="350" y="211" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">B == 50</text>
<text x="72" y="244" font-size="21" font-weight="700" fill="#20232b" text-anchor="start" class="mono">True</text>
<text x="227" y="244" font-size="21" font-weight="700" fill="#20232b" text-anchor="start" class="mono">True</text>
<text x="382" y="244" font-size="21" font-weight="700" fill="#20232b" text-anchor="start" class="mono">True</text>
<text x="42" y="271" font-size="20" font-weight="700" fill="#b92b3e" text-anchor="start" class="mono">np.all(...) = True</text>
<rect x="24" y="304" width="512" height="148" rx="10" fill="#ffffff" stroke="#dcdfe4"/>
<rect x="42" y="323" width="26" height="26" rx="4" fill="rgb(230, 60, 100)" stroke="none"/>
<text x="82" y="346" font-size="22" font-weight="700" fill="#20232b" text-anchor="start" class="mono">[230, 60, 100]</text>
<text x="42" y="381" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">R == 230</text>
<text x="195" y="381" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">G == 60</text>
<text x="350" y="381" font-size="18" font-weight="400" fill="#20232b" text-anchor="start" class="mono">B == 50</text>
<text x="72" y="414" font-size="21" font-weight="700" fill="#20232b" text-anchor="start" class="mono">True</text>
<text x="227" y="414" font-size="21" font-weight="700" fill="#20232b" text-anchor="start" class="mono">True</text>
<text x="382" y="414" font-size="21" font-weight="700" fill="#b92b3e" text-anchor="start" class="mono">False</text>
<text x="42" y="441" font-size="20" font-weight="700" fill="#b92b3e" text-anchor="start" class="mono">np.all(...) = False</text>
<line x1="280" y1="454" x2="280" y2="476" stroke="#b92b3e" stroke-width="2"/>
<path d="M275,474 L280,482 L285,474" fill="none" stroke="#b92b3e" stroke-width="2"/>
<rect x="24" y="493" width="512" height="79" rx="10" fill="#f7e9ec" stroke="none"/>
<text x="280" y="524" font-size="23" font-weight="700" fill="#20232b" text-anchor="middle" class="mono">np.all(result, axis=-1)</text>
<text x="280" y="554" font-size="19" font-weight="400" fill="#20232b" text-anchor="middle">Check the 3 channels separately at every (y, x).</text>
</svg>
