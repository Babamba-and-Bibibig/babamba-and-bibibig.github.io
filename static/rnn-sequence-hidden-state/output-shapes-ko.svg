<path d="M287 657V695H560V727" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M833 657V695H560" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="105" y="727" width="910" height="198" rx="12" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="560" y="766" font-size="25" fill="#177052" font-weight="700" text-anchor="middle">마지막 상태: output[:, -1, :]  →  (2, 3)</text>
<text x="135" y="817" font-size="21" fill="#4e6078" font-weight="400" text-anchor="start">시퀀스 0</text>
<text x="665" y="817" font-size="24" fill="#17253d" font-weight="400" text-anchor="middle" class="mono">[0.645847, 0.176484, 0.997772]</text>
