<path d="M560 925V967" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="105" y="967" width="910" height="130" rx="12" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="560.0" y="1001" font-size="25" fill="#7043b5" font-weight="700" text-anchor="middle">nn.RNN의 h_n: (1, 2, 3)</text>
<text x="560.0" y="1035" font-size="21" fill="#17253d" font-weight="400" text-anchor="middle">축 0: 층·방향 1개 · 축 1: 시퀀스 2개 · 축 2: 은닉값 3개</text>
<text x="560.0" y="1064" font-size="21" fill="#17253d" font-weight="400" text-anchor="middle">h_n[0] = output[:, -1, :]  ·  두 텐서의 shape는 (2, 3)</text>
<text x="34" y="1150" font-size="22" fill="#4e6078" font-weight="400" text-anchor="start">마지막 시점을 선택해도 각 시퀀스의 은닉값 A, B, C를 모두 가져온다.</text>
<text x="34" y="1188" font-size="22" fill="#4e6078" font-weight="400" text-anchor="start">batch_first=True는 h_n의 축 순서를 바꾸지 않는다.</text>
</svg>
