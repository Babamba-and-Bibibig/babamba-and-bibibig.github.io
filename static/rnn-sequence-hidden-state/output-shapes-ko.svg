<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1250" viewBox="0 0 1120 1250" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">모든 시점의 결과와 마지막 상태를 구분한다</title><desc id="desc">output은 두 시퀀스의 모든 다섯 시점에서 세 은닉값을 담는다. 마지막 시점만 선택하면 2×3이며 nn.RNN의 h_n은 층 축을 포함한 1×2×3이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6078"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="1120" height="1250" rx="22" fill="#f7f9fc" stroke="none" stroke-width="1.5"/>
<text x="34" y="48" font-size="30" fill="#17253d" font-weight="700" text-anchor="start">모든 시점의 결과와 마지막 상태를 구분한다</text>
<text x="34" y="87" font-size="21" fill="#4e6078" font-weight="400" text-anchor="start">한 층 · 단방향 · batch_first=True · 출력의 각 값은 소수점 여섯 자리로 표시</text>
<rect x="34" y="117" width="1052" height="115" rx="12" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="560.0" y="151" font-size="24" fill="#235fbe" font-weight="700" text-anchor="middle">전체 output: (B, T, H) = (2, 5, 3)</text>
<text x="560.0" y="185" font-size="21" fill="#17253d" font-weight="400" text-anchor="middle">RNNCell 결과 5개를 stack(dim=1)로 모은 값 = 같은 파라미터의 nn.RNN output</text>
<text x="560.0" y="214" font-size="21" fill="#17253d" font-weight="400" text-anchor="middle">축 0: 시퀀스 2개 · 축 1: 시점 5개 · 축 2: 은닉값 3개</text>
<rect x="34" y="264" width="506" height="393" rx="12" fill="#ffffff" stroke="#c9d3df" stroke-width="1.5"/>
<text x="56" y="301" font-size="25" fill="#235fbe" font-weight="700" text-anchor="start">output[0]  ·  (5, 3)</text>
