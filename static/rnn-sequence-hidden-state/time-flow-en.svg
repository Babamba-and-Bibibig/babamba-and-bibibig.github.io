<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1260" viewBox="0 0 1120 1260" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The complete hidden state moves to the next step</title><desc id="desc">Five steps of one sequence reuse the same cell and parameters. Each step receives four current input values and all three previous hidden values.</desc>
