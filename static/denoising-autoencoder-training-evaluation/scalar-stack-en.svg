<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1070" viewBox="0 0 920 1070" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From scalar losses to one value per image</title>
<desc id="desc">Illustrative scalar losses 0.1, 0.2, 0.3 each have shape (). A Python list has no tensor shape. Stacking produces (3,), then unsqueeze(1) produces (3,1). Separately, flatten(1) and mean(1) reduce eight image error maps to (8,).</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L10 5.5 L1 10 Z" fill="#59718a"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","DejaVu Sans",sans-serif}</style>
<rect width="920" height="1070" rx="16" fill="#f5f7fb"/>
<text x="35" y="48" font-size="28" fill="#172033" font-weight="700" text-anchor="start">From scalar losses to one value per image</text>
<text x="35" y="82" font-size="18" fill="#46566c" font-weight="400" text-anchor="start">0.1, 0.2, 0.3 are shape examples, not measured model performance.</text>
<rect x="40" y="130" width="250" height="84" rx="12" fill="#e9f2fc" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="165.0" y="164.85" font-size="21" fill="#172033" font-weight="700" text-anchor="middle">tensor(0.1)</text>
<text x="165.0" y="193.85" font-size="21" fill="#172033" font-weight="400" text-anchor="middle">shape ()</text>
<rect x="335" y="130" width="250" height="84" rx="12" fill="#e9f2fc" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="460.0" y="164.85" font-size="21" fill="#172033" font-weight="700" text-anchor="middle">tensor(0.2)</text>
<text x="460.0" y="193.85" font-size="21" fill="#172033" font-weight="400" text-anchor="middle">shape ()</text>
<rect x="630" y="130" width="250" height="84" rx="12" fill="#e9f2fc" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="755.0" y="164.85" font-size="21" fill="#172033" font-weight="700" text-anchor="middle">tensor(0.3)</text>
<text x="755.0" y="193.85" font-size="21" fill="#172033" font-weight="400" text-anchor="middle">shape ()</text>
<path d="M165,223 L165,248 L280,248 L280,271" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M460,223 L460,271" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M755,223 L755,248 L640,248 L640,271" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="180" y="282" width="560" height="95" rx="12" fill="#fff2d9" stroke="#996014" stroke-width="1.5"/>
<text x="460.0" y="322.0" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">Python list: [loss_0, loss_1, loss_2]</text>
<text x="460.0" y="351.0" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">len = 3 · the list itself has no shape</text>
<path d="M460,385 L460,421" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="180" y="433" width="560" height="100" rx="12" fill="#e8f5ef" stroke="#176d58" stroke-width="1.5"/>
<text x="460.0" y="475.5" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">torch.stack(losses, dim=0)</text>
<text x="460.0" y="504.5" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">tensor([0.1, 0.2, 0.3]) · shape (3,)</text>
<path d="M460,541 L460,577" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="180" y="589" width="560" height="158" rx="12" fill="#f1ebf9" stroke="#7444a5" stroke-width="1.5"/>
<text x="200" y="623" font-size="21" fill="#172033" font-weight="700" text-anchor="start">each.unsqueeze(1)</text>
<text x="200" y="658" font-size="21" fill="#172033" font-weight="400" text-anchor="start">shape (3, 1)</text>
<text x="200" y="700" font-size="18" fill="#172033" font-weight="400" text-anchor="start">Still the same three values</text>
<text x="570" y="628" font-size="23" fill="#172033" font-weight="400" text-anchor="middle">[[0.1],</text>
<text x="570" y="664" font-size="23" fill="#172033" font-weight="400" text-anchor="middle"> [0.2],</text>
<text x="570" y="700" font-size="23" fill="#172033" font-weight="400" text-anchor="middle"> [0.3]]</text>
<text x="40" y="803" font-size="22" fill="#172033" font-weight="700" text-anchor="start">Compute one MSE per image without a Python loop</text>
<text x="40" y="837" font-size="18" fill="#46566c" font-weight="400" text-anchor="start">Input: eight paired reconstructions and targets. Values below are shapes.</text>
<rect x="40" y="872" width="250" height="84" rx="12" fill="#e9f2fc" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="165.0" y="906.5" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">Squared errors</text>
<text x="165.0" y="935.5" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">(8, 1, 28, 28)</text>
<rect x="335" y="872" width="250" height="84" rx="12" fill="#fff2d9" stroke="#996014" stroke-width="1.5"/>
<text x="460.0" y="906.5" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">flatten(start_dim=1)</text>
<text x="460.0" y="935.5" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">(8, 784)</text>
<rect x="630" y="872" width="250" height="84" rx="12" fill="#e8f5ef" stroke="#176d58" stroke-width="1.5"/>
<text x="755.0" y="906.5" font-size="20" fill="#172033" font-weight="700" text-anchor="middle">mean(dim=1)</text>
<text x="755.0" y="935.5" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">(8,)</text>
<path d="M298,914 L325,914" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M593,914 L620,914" fill="none" stroke="#59718a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="40" y="1004" font-size="20" fill="#172033" font-weight="400" text-anchor="start">Keep image axis 0; average channels, height and width within each image.</text>
</svg>
