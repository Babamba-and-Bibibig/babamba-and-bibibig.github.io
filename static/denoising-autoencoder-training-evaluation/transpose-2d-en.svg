<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1140" viewBox="0 0 920 1140" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Transposed convolution: overlapping output regions</title>
<desc id="desc">For a 2×2 input A B C D and 4×4 kernels, output regions begin at (0,0), (0,2), (2,0), (2,2). The uncropped span is 6×6; padding 1 leaves 4×4. At pre-crop (2,2), sum A*k22+B*k20+C*k02+D*k00. This diagram shows one input channel; all four channel results and bias are added in the model.</desc>
