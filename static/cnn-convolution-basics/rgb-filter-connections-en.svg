<rect x="678" y="474" width="224" height="76" rx="10" fill="white" stroke="#1d4ed8" stroke-width="1.5" />
<text x="790" y="503" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">B kernel (3×3)</text>
<text x="790" y="531" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">Multiply, then sum</text>
