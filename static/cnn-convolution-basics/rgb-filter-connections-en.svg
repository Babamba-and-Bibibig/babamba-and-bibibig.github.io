<text x="170" y="873" font-size="17" fill="#52627b" font-weight="400" text-anchor="middle">49 spatial positions</text>
<rect x="678" y="586" width="224" height="90" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
