<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1040" viewBox="0 0 960 1040" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Every filter connects to all three RGB channels</title><desc id="desc">Each R, G, and B input channel connects to the corresponding 3×3 kernel in both filter A and filter B. Each filter adds the three channel results and its bias to make one output channel. The input shape is (1,3,7,7), weights (2,3,3,3), and output (1,2,7,7).</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627b" /></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be123c" /></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d" /></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8" /></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d28d9" /></marker>
</defs><style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.num{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="960" height="1040" rx="20" fill="#f6f8fc" stroke="none" stroke-width="1.5" />
<text x="32" y="48" font-size="28" fill="#16243b" font-weight="700" text-anchor="start">Every filter connects to all three RGB channels</text>
<text x="32" y="84" font-size="20" fill="#52627b" font-weight="400" text-anchor="start">3×3 kernel · stride=1 · padding=1 · groups=1</text>
<rect x="24" y="114" width="294" height="610" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
<rect x="642" y="114" width="294" height="610" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5" />
<text x="171" y="150" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle">Filter A</text>
<text x="171" y="181" font-size="19" fill="#52627b" font-weight="400" text-anchor="middle">weights (3, 3, 3)</text>
<text x="789" y="150" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle">Filter B</text>
<text x="789" y="181" font-size="19" fill="#52627b" font-weight="400" text-anchor="middle">weights (3, 3, 3)</text>
<text x="480" y="150" font-size="24" fill="#16243b" font-weight="700" text-anchor="middle">One RGB image</text>
<text x="480" y="181" font-size="19" fill="#52627b" font-weight="400" text-anchor="middle">input (1, 3, 7, 7)</text>
<rect x="376" y="234" width="208" height="76" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" />
<text x="480" y="265" font-size="23" fill="#be123c" font-weight="700" text-anchor="middle">R channel</text>
<text x="480" y="293" font-size="20" fill="#16243b" font-weight="400" text-anchor="middle" class="num">(7, 7)</text>
