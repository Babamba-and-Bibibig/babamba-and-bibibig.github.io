<text x="790" y="383" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">G kernel (3×3)</text>
<text x="790" y="411" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">Multiply, then sum</text>
