<text x="170" y="291" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">Multiply, then sum</text>
<rect x="678" y="234" width="224" height="76" rx="10" fill="white" stroke="#be123c" stroke-width="1.5" />
<text x="790" y="263" font-size="20" fill="#be123c" font-weight="700" text-anchor="middle">R kernel (3×3)</text>
