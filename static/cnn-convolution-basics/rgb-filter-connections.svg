<text x="480" y="181" font-size="19" fill="#52627b" font-weight="400" text-anchor="middle">입력 (1, 3, 7, 7)</text>
<rect x="376" y="234" width="208" height="76" rx="12" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/>
