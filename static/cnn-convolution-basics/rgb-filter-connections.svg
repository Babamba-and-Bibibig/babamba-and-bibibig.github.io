<text x="170" y="503" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">B용 커널 (3×3)</text>
<text x="170" y="531" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">같은 위치끼리 곱해 합산</text>
