<text x="480" y="698" font-size="17" fill="#52627b" font-weight="400" text-anchor="middle">필터 2개 × 채널별 커널 3개</text>
<path d="M170 900V928H790V900" fill="none" stroke="#52627b" stroke-width="2" stroke-linejoin="round"/>
<path d="M480 928L480 953" fill="none" stroke="#52627b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="987" font-size="26" fill="#16243b" font-weight="700" text-anchor="middle">전체 출력 (1, 2, 7, 7)</text>
<text x="480" y="1020" font-size="20" fill="#52627b" font-weight="400" text-anchor="middle">각 필터는 자기 가중치를 모든 출력 위치에서 재사용한다.</text>
</svg>
