<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1220" viewBox="0 0 960 1220" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">이미지 두 장이 CNN을 통과하는 전체 흐름</title><desc id="desc">입력 (2,1,28,28)은 첫 합성곱과 ReLU 후 (2,32,28,28), 풀링 후 (2,32,14,14)이 된다. 둘째 합성곱과 ReLU 후 (2,64,14,14), 풀링 후 (2,64,7,7)이 된다. Flatten은 (2,3136), Linear는 (2,10)을 출력한다. 모든 단계에서 배치의 이미지 두 장은 유지된다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627b"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be123c"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d28d9"/></marker>
</defs><style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.num{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="960" height="1220" rx="20" fill="#f6f8fc" stroke="none" stroke-width="1.5"/>
<text x="32" y="48" font-size="28" fill="#16243b" font-weight="700" text-anchor="start">이미지 두 장이 CNN을 통과하는 전체 흐름</text>
<text x="32" y="88" font-size="22" fill="#52627b" font-weight="400" text-anchor="start">shape 순서: 배치 N · 채널 C · 세로 H · 가로 W</text>
<rect x="32" y="126" width="896" height="84" rx="13" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="54" y="161" font-size="21" fill="#16243b" font-weight="700" text-anchor="start">입력</text>
<text x="54" y="191" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">첫 숫자 2는 이미지 개수</text>
<text x="487" y="177" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 1, 28, 28)</text>
<text x="732" y="174" font-size="20" fill="#16243b" font-weight="700" text-anchor="start">흑백 이미지 2장</text>
<path d="M487 211L487 235" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="238" width="896" height="84" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="54" y="273" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">Conv2d(1, 32, 3)</text>
<text x="54" y="303" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">3×3 커널 · stride=1</text>
<text x="487" y="289" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 32, 28, 28)</text>
<text x="732" y="286" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="start">padding=1</text>
<path d="M487 323L487 347" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="350" width="896" height="84" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="54" y="385" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">ReLU</text>
<text x="54" y="415" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">배열의 크기는 그대로</text>
<text x="487" y="401" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 32, 28, 28)</text>
<text x="732" y="398" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="start">음수 → 0</text>
<path d="M487 435L487 459" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="462" width="896" height="84" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
<text x="54" y="497" font-size="21" fill="#0f766e" font-weight="700" text-anchor="start">MaxPool2d(2)</text>
<text x="54" y="527" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">2×2 영역 · stride=2</text>
<text x="487" y="513" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 32, 14, 14)</text>
<text x="732" y="510" font-size="20" fill="#0f766e" font-weight="700" text-anchor="start">28 → 14</text>
<path d="M487 547L487 571" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="574" width="896" height="84" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="54" y="609" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">Conv2d(32, 64, 3)</text>
<text x="54" y="639" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">3×3 커널 · stride=1</text>
<text x="487" y="625" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 64, 14, 14)</text>
<text x="732" y="622" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="start">padding=1</text>
<path d="M487 659L487 683" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="686" width="896" height="84" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="54" y="721" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="start">ReLU</text>
<text x="54" y="751" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">배열의 크기는 그대로</text>
<text x="487" y="737" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 64, 14, 14)</text>
<text x="732" y="734" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="start">음수 → 0</text>
<path d="M487 771L487 795" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="798" width="896" height="84" rx="13" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
<text x="54" y="833" font-size="21" fill="#0f766e" font-weight="700" text-anchor="start">MaxPool2d(2)</text>
<text x="54" y="863" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">2×2 영역 · stride=2</text>
<text x="487" y="849" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 64, 7, 7)</text>
<text x="732" y="846" font-size="20" fill="#0f766e" font-weight="700" text-anchor="start">14 → 7</text>
<path d="M487 883L487 907" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="910" width="896" height="84" rx="13" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
<text x="54" y="945" font-size="21" fill="#b45309" font-weight="700" text-anchor="start">Flatten</text>
<text x="54" y="975" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">start_dim=1</text>
<text x="487" y="961" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 3136)</text>
<text x="732" y="958" font-size="20" fill="#b45309" font-weight="700" text-anchor="start">64 × 7 × 7</text>
<path d="M487 995L487 1019" fill="none" stroke="#52627b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="32" y="1022" width="896" height="84" rx="13" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="54" y="1057" font-size="21" fill="#6d28d9" font-weight="700" text-anchor="start">Linear(3136, 10)</text>
<text x="54" y="1087" font-size="18" fill="#52627b" font-weight="400" text-anchor="start">이미지마다 같은 층 사용</text>
<text x="487" y="1073" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 10)</text>
<text x="732" y="1070" font-size="20" fill="#6d28d9" font-weight="700" text-anchor="start">클래스 점수 10개</text>
<rect x="32" y="1154" width="896" height="44" rx="9" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480" y="1183" font-size="20" fill="#52627b" font-weight="400" text-anchor="middle">이 흐름은 순전파다. 학습하려면 손실 계산·역전파·가중치 갱신이 추가된다.</text>
</svg>
