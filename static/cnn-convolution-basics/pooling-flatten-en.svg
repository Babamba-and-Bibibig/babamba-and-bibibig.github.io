<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1020" viewBox="0 0 960 1020" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Pooling selects values; Flatten lists them</title><desc id="desc">Max pooling selects one maximum from a 2×2 area independently in each channel. The two illustrated channels produce 7 and 9. Flatten with start_dim 1 lists 64×7×7 values separately for each of two images, transforming (2,64,7,7) into (2,3136) while preserving the batch dimension.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52627b" /></marker>
<marker id="red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be123c" /></marker>
<marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d" /></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8" /></marker>
<marker id="teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e" /></marker>
<marker id="orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309" /></marker>
<marker id="purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d28d9" /></marker>
</defs><style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.num{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="960" height="1020" rx="20" fill="#f6f8fc" stroke="none" stroke-width="1.5" />
<text x="32" y="48" font-size="28" fill="#16243b" font-weight="700" text-anchor="start">Pooling selects values; Flatten lists them</text>
<text x="32" y="91" font-size="24" fill="#0f766e" font-weight="700" text-anchor="start">1. MaxPool2d(2): handle each channel’s 2×2 area separately</text>
<text x="32" y="124" font-size="20" fill="#52627b" font-weight="400" text-anchor="start">Below are selected areas from two of the channels.</text>
<rect x="32" y="151" width="432" height="230" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" />
<text x="56" y="188" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="start">Channel A</text>
<rect x="60" y="214" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="87.0" y="249.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">1</text>
<rect x="114" y="214" width="54" height="54" rx="0" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1" />
<text x="141.0" y="249.75" font-size="25" fill="#1d4ed8" font-weight="700" text-anchor="middle" class="num">7</text>
<rect x="60" y="268" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="87.0" y="303.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">3</text>
<rect x="114" y="268" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="141.0" y="303.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">4</text>
<text x="266" y="223" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">Maximum</text>
<path d="M189 269L331 269" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#teal)" />
<rect x="346" y="229" width="74" height="80" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
<text x="383" y="282" font-size="31" fill="#1d4ed8" font-weight="700" text-anchor="middle" class="num">7</text>
<text x="248" y="357" font-size="17" fill="#52627b" font-weight="400" text-anchor="middle">Values from other channels stay separate.</text>
<rect x="496" y="151" width="432" height="230" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" />
<text x="520" y="188" font-size="23" fill="#6d28d9" font-weight="700" text-anchor="start">Channel B</text>
<rect x="524" y="214" width="54" height="54" rx="0" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1" />
<text x="551.0" y="249.75" font-size="25" fill="#6d28d9" font-weight="700" text-anchor="middle" class="num">9</text>
<rect x="578" y="214" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="605.0" y="249.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">2</text>
<rect x="524" y="268" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="551.0" y="303.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">5</text>
<rect x="578" y="268" width="54" height="54" rx="0" fill="white" stroke="#cbd5e1" stroke-width="1" />
<text x="605.0" y="303.75" font-size="25" fill="#16243b" font-weight="400" text-anchor="middle" class="num">6</text>
<text x="730" y="223" font-size="21" fill="#0f766e" font-weight="700" text-anchor="middle">Maximum</text>
<path d="M653 269L795 269" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#teal)" />
<rect x="810" y="229" width="74" height="80" rx="9" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
<text x="847" y="282" font-size="31" fill="#6d28d9" font-weight="700" text-anchor="middle" class="num">9</text>
<text x="712" y="357" font-size="17" fill="#52627b" font-weight="400" text-anchor="middle">Values from other channels stay separate.</text>
<text x="480" y="425" font-size="25" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 64, 14, 14)  →  (2, 64, 7, 7)</text>
<text x="480" y="457" font-size="20" fill="#52627b" font-weight="400" text-anchor="middle">Keep batch size 2 and all 64 channels; reduce height and width.</text>
<path d="M32 489L928 489" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
<text x="32" y="534" font-size="24" fill="#b45309" font-weight="700" text-anchor="start">2. flatten(start_dim=1): list 3136 values per image</text>
<rect x="32" y="575" width="896" height="145" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" />
<text x="56" y="610" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">Image 0</text>
<rect x="74" y="612" width="74" height="58" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="66" y="620" width="74" height="58" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="58" y="628" width="74" height="58" rx="3" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<text x="172" y="647" font-size="21" fill="#16243b" font-weight="400" text-anchor="start">64 channels</text>
<text x="172" y="681" font-size="20" fill="#52627b" font-weight="400" text-anchor="start">7×7 each</text>
<path d="M300 655L408 655" fill="none" stroke="#b45309" stroke-width="2.6" marker-end="url(#orange)" />
<rect x="436" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="485" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="534" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="583" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="632" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="681" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="730" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="779" y="632" width="49" height="46" rx="0" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1" />
<rect x="508" y="638" width="248" height="33" rx="5" fill="#dbeafe" stroke="none" stroke-width="1.5" />
<text x="632" y="664" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="middle">Values in original order</text>
<text x="632" y="704" font-size="21" fill="#16243b" font-weight="700" text-anchor="middle">64 × 7 × 7 = 3136 values</text>
<rect x="32" y="746" width="896" height="145" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5" />
<text x="56" y="781" font-size="22" fill="#6d28d9" font-weight="700" text-anchor="start">Image 1</text>
<rect x="74" y="783" width="74" height="58" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="66" y="791" width="74" height="58" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="58" y="799" width="74" height="58" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<text x="172" y="818" font-size="21" fill="#16243b" font-weight="400" text-anchor="start">64 channels</text>
<text x="172" y="852" font-size="20" fill="#52627b" font-weight="400" text-anchor="start">7×7 each</text>
<path d="M300 826L408 826" fill="none" stroke="#b45309" stroke-width="2.6" marker-end="url(#orange)" />
<rect x="436" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="485" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="534" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="583" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="632" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="681" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="730" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="779" y="803" width="49" height="46" rx="0" fill="#ede9fe" stroke="#6d28d9" stroke-width="1" />
<rect x="508" y="809" width="248" height="33" rx="5" fill="#ede9fe" stroke="none" stroke-width="1.5" />
<text x="632" y="835" font-size="18" fill="#6d28d9" font-weight="700" text-anchor="middle">Values in original order</text>
<text x="632" y="875" font-size="21" fill="#16243b" font-weight="700" text-anchor="middle">64 × 7 × 7 = 3136 values</text>
<text x="480" y="938" font-size="27" fill="#16243b" font-weight="700" text-anchor="middle" class="num">(2, 64, 7, 7)  →  (2, 3136)</text>
<text x="480" y="980" font-size="21" fill="#52627b" font-weight="400" text-anchor="middle">Preserve dimension 0, the batch. Keep the two images separate.</text>
</svg>