<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1120" viewBox="0 0 1040 1120" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">같은 위치끼리 더한 뒤, 음수만 0으로 바꾼다</title><desc id="desc">main [[1,-2,3],[4,0,-1]]과 skip [[2,1,-4],[-1,5,2]]를 원소별로 더하면 [[3,-1,-1],[3,5,1]]이다. ReLU 뒤에는 [[3,0,0],[3,5,1]]이다. 고정한 한 이미지 한 채널의 일부2×3 영역을 보여준다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4e6078"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect x="0" y="0" width="1040" height="1120" rx="22" fill="#f7f9fc" stroke="none" stroke-width="1.5"/>
<text x="34" y="48" font-size="30" fill="#17253d" font-weight="700" text-anchor="start">같은 위치끼리 더한 뒤, 음수만 0으로 바꾼다</text>
<text x="34" y="86" font-size="21" fill="#4e6078" font-weight="400" text-anchor="start">n과 c를 고정한 뒤, 한 채널의 2×3 부분만 꺼내 표시한다.</text>
<text x="265" y="132" font-size="25" fill="#7043b5" font-weight="700" text-anchor="middle">main</text>
<rect x="115" y="158" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="165" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">1</text>
<rect x="215" y="158" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="265" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-2</text>
<rect x="315" y="158" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="365" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">3</text>
<rect x="115" y="230" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="165" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">4</text>
<rect x="215" y="230" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="265" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">0</text>
<rect x="315" y="230" width="100" height="72" rx="0" fill="#f1ebfc" stroke="#7043b5" stroke-width="1.5"/>
<text x="365" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-1</text>
<text x="775" y="132" font-size="25" fill="#177052" font-weight="700" text-anchor="middle">skip</text>
<rect x="625" y="158" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="675" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">2</text>
<rect x="725" y="158" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="775" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">1</text>
<rect x="825" y="158" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="875" y="206" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-4</text>
<rect x="625" y="230" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="675" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-1</text>
<rect x="725" y="230" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="775" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">5</text>
<rect x="825" y="230" width="100" height="72" rx="0" fill="#e6f5ed" stroke="#177052" stroke-width="1.5"/>
<text x="875" y="278" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">2</text>
<text x="520" y="246" font-size="48" fill="#aa530e" font-weight="700" text-anchor="middle">+</text>
<path d="M265 304V353H488" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M775 304V353H552" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="520" cy="353" r="27" fill="#fff1dd" stroke="#aa530e" stroke-width="2"/>
<text x="520" y="364" font-size="35" fill="#aa530e" font-weight="700" text-anchor="middle">+</text>
<path d="M520 382V438" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="468" font-size="25" fill="#aa530e" font-weight="700" text-anchor="middle">합산 결과</text>
<rect x="370" y="494" width="100" height="72" rx="0" fill="#fff1dd" stroke="#aa530e" stroke-width="1.5"/>
<text x="420" y="542" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">3</text>
<rect x="470" y="494" width="100" height="72" rx="0" fill="#ffe2e2" stroke="#aa530e" stroke-width="1.5"/>
<text x="520" y="542" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-1</text>
<rect x="570" y="494" width="100" height="72" rx="0" fill="#ffe2e2" stroke="#aa530e" stroke-width="1.5"/>
<text x="620" y="542" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">-1</text>
<rect x="370" y="566" width="100" height="72" rx="0" fill="#fff1dd" stroke="#aa530e" stroke-width="1.5"/>
<text x="420" y="614" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">3</text>
<rect x="470" y="566" width="100" height="72" rx="0" fill="#fff1dd" stroke="#aa530e" stroke-width="1.5"/>
<text x="520" y="614" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">5</text>
<rect x="570" y="566" width="100" height="72" rx="0" fill="#fff1dd" stroke="#aa530e" stroke-width="1.5"/>
<text x="620" y="614" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">1</text>
<text x="520" y="682" font-size="23" fill="#17253d" font-weight="400" text-anchor="middle">예: 같은 첫 줄 두 번째 위치에서 −2 + 1 = −1</text>
<path d="M520 706V744" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="411" y="759" width="218" height="61" rx="12" fill="#fff1dd" stroke="#aa530e" stroke-width="1.5"/>
<text x="520" y="800" font-size="29" fill="#aa530e" font-weight="700" text-anchor="middle">ReLU</text>
<path d="M520 821V856" fill="none" stroke="#4e6078" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="520" y="887" font-size="25" fill="#235fbe" font-weight="700" text-anchor="middle">최종 출력</text>
<rect x="370" y="913" width="100" height="72" rx="0" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="420" y="961" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">3</text>
<rect x="470" y="913" width="100" height="72" rx="0" fill="#ffe2e2" stroke="#235fbe" stroke-width="1.5"/>
<text x="520" y="961" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">0</text>
<rect x="570" y="913" width="100" height="72" rx="0" fill="#ffe2e2" stroke="#235fbe" stroke-width="1.5"/>
<text x="620" y="961" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">0</text>
<rect x="370" y="985" width="100" height="72" rx="0" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="420" y="1033" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">3</text>
<rect x="470" y="985" width="100" height="72" rx="0" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="520" y="1033" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">5</text>
<rect x="570" y="985" width="100" height="72" rx="0" fill="#eaf2ff" stroke="#235fbe" stroke-width="1.5"/>
<text x="620" y="1033" font-size="33" fill="#17253d" font-weight="600" text-anchor="middle">1</text>
<text x="520" y="1091" font-size="22" fill="#4e6078" font-weight="500" text-anchor="middle">2×3 부분의 shape 유지 · 전체 텐서도 (N, C, H, W) 유지</text>
</svg>
