<title id="title">stride가 같아도, 커널을 놓을 수 있는 횟수는 다르다</title><desc id="desc">입력 높이16과 stride2에서 3×3 패딩1은 8곳, 1×1 패딩0은 8곳, 3×3 패딩0은 7곳에서 계산한다. 번호는 패딩을 포함한 입력에서 0부터 센 커널 시작 위치다.</desc>
