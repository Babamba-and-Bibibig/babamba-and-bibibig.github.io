<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">전체 평균에서는 샘플 한 개씩을 동등하게 센다</title>
<desc id="desc">100개 검증 샘플이 32, 32, 32, 4개 배치로 나뉜 예시다. 배치별 평균 손실에 그 배치의 샘플 수를 곱해 합친 뒤 실제 샘플 수로 나누면 샘플을 동등하게 반영한다. 배치 평균 네 개를 단순 평균하면 작은 마지막 배치의 각 샘플이 더 큰 비중을 갖는다. 조건은 클래스 가중치와 무시 라벨이 없는 기본 CrossEntropyLoss mean 설정이다.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#59718a"/></marker></defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif}</style>
<rect width="1000" height="960" rx="16" fill="#f5f7fb"/>
<text x="36" y="50" font-size="27" fill="#172033" font-weight="700" text-anchor="start" data-width="928">전체 평균에서는 샘플 한 개씩을 동등하게 센다</text>
<text x="36" y="86" font-size="20" fill="#46566c" font-weight="400" text-anchor="start" data-width="928">검증 샘플 100개 · batch_size=32 · drop_last=False</text>
<text x="40" y="140" font-size="23" fill="#172033" font-weight="700" text-anchor="start" data-width="920">배치는 4개지만, 평균을 낼 대상은 샘플 100개다.</text>
<text x="40" y="177" font-size="19" fill="#46566c" font-weight="400" text-anchor="start" data-width="920">막대의 너비는 각 배치의 샘플 수에 비례한다.</text>
<rect x="40" y="201" width="288" height="65" rx="0" fill="#e8f1fb" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="184.0" y="242" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="268">배치 1 · 32개</text>
<rect x="328" y="201" width="288" height="65" rx="0" fill="#dfebfa" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="472.0" y="242" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="268">배치 2 · 32개</text>
<rect x="616" y="201" width="288" height="65" rx="0" fill="#d6e6f7" stroke="#1b5fa7" stroke-width="1.5"/>
<text x="760.0" y="242" font-size="21" fill="#172033" font-weight="700" text-anchor="middle" data-width="268">배치 3 · 32개</text>
<rect x="904" y="201" width="36" height="65" rx="0" fill="#fff0df" stroke="#9b4d08" stroke-width="1.5"/>
<path d="M922.0 270 V288 H810" fill="none" stroke="#9b4d08" stroke-width="2.4" stroke-linejoin="round"/>
<text x="805" y="309" font-size="20" fill="#9b4d08" font-weight="700" text-anchor="middle" data-width="280">배치 4 · 4개</text>
<rect x="40" y="350" width="440" height="410" rx="12" fill="#e7f5f1" stroke="#08786c" stroke-width="1.5"/>
<text x="64" y="390" font-size="22" fill="#08786c" font-weight="700" text-anchor="start" data-width="392">샘플 수를 반영한 전체 평균</text>
<text x="64" y="433" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">각 배치의 평균 손실에</text>
<text x="64" y="464" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">그 배치의 샘플 수를 곱한다.</text>
<path d="M260 486 V515" fill="none" stroke="#08786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="64" y="550" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">모든 배치의 값을 합치면</text>
<text x="64" y="581" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">샘플별 손실의 전체 합계가 된다.</text>
<path d="M260 600 V627" fill="none" stroke="#08786c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="64" y="662" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="392">실제로 처리한 100개로 나눈다.</text>
<text x="64" y="693" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="392">샘플 한 개의 비중이 모두 같다.</text>
<text x="64" y="735" font-size="19" fill="#08786c" font-weight="700" text-anchor="start" data-width="392">손실 합계 ÷ 실제 처리한 샘플 수</text>
<rect x="520" y="350" width="440" height="410" rx="12" fill="#fff0df" stroke="#9b4d08" stroke-width="1.5"/>
<text x="544" y="390" font-size="22" fill="#9b4d08" font-weight="700" text-anchor="start" data-width="392">배치 평균 네 개를 단순 평균</text>
<text x="544" y="433" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">32개를 대표하는 평균과</text>
<text x="544" y="464" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">4개를 대표하는 평균을</text>
<text x="544" y="505" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">같은 비중으로 반영한다.</text>
<path d="M740 539 V570" fill="none" stroke="#9b4d08" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="544" y="607" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">작은 배치의 샘플 한 개가</text>
<text x="544" y="638" font-size="21" fill="#172033" font-weight="400" text-anchor="start" data-width="392">더 큰 비중으로 반영된다.</text>
<text x="544" y="691" font-size="20" fill="#9b4d08" font-weight="700" text-anchor="start" data-width="392">배치 크기가 다르면 전체 샘플의</text>
<text x="544" y="722" font-size="20" fill="#9b4d08" font-weight="700" text-anchor="start" data-width="392">평균과 달라질 수 있다.</text>
<rect x="40" y="795" width="920" height="125" rx="12" fill="#ffffff" stroke="#59718a" stroke-width="1.5"/>
<text x="64" y="834" font-size="22" fill="#172033" font-weight="700" text-anchor="start" data-width="872">적용 조건</text>
<text x="64" y="867" font-size="20" fill="#172033" font-weight="400" text-anchor="start" data-width="872">CrossEntropyLoss(reduction=&quot;mean&quot;) · 클래스 가중치 없음 · 무시 라벨 없음</text>
<text x="64" y="900" font-size="18" fill="#46566c" font-weight="400" text-anchor="start" data-width="872">손실 함수가 평균을 낸 대상을 확인한다. 가중치나 무시 라벨이 있으면 분모도 다시 확인한다.</text>
</svg>
