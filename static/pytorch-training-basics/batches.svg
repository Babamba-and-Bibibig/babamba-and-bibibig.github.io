<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc"><title id="title">500 samples, batch size 64</title><desc id="desc">Seven full batches of sixty-four samples and one final batch of fifty-two make one epoch and eight updates for this training loop.</desc><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:25px}.code{font-family:monospace;font-size:24px}.small{font-size:20px}</style><rect width="900" height="340" rx="18" fill="#f8fafc"/><text class="code" x="35" y="45">N = 500; batch_size = 64; drop_last = False</text><g fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"><rect x="26" y="100" width="92" height="82" rx="10"/><rect x="134" y="100" width="92" height="82" rx="10"/><rect x="242" y="100" width="92" height="82" rx="10"/><rect x="350" y="100" width="92" height="82" rx="10"/><rect x="458" y="100" width="92" height="82" rx="10"/><rect x="566" y="100" width="92" height="82" rx="10"/><rect x="674" y="100" width="92" height="82" rx="10"/></g><rect x="782" y="100" width="92" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><g text-anchor="middle"><text class="small" x="72" y="84">1</text><text class="small" x="180" y="84">2</text><text class="small" x="288" y="84">3</text><text class="small" x="396" y="84">4</text><text class="small" x="504" y="84">5</text><text class="small" x="612" y="84">6</text><text class="small" x="720" y="84">7</text><text class="small" x="828" y="84">8</text><text x="72" y="151">64</text><text x="180" y="151">64</text><text x="288" y="151">64</text><text x="396" y="151">64</text><text x="504" y="151">64</text><text x="612" y="151">64</text><text x="720" y="151">64</text><text x="828" y="151">52</text></g><path d="M36 205V225H864V205M450 225V247" fill="none" stroke="#475569" stroke-width="2"/><text class="code" x="450" y="278" text-anchor="middle">64 × 7 + 52 = 500</text><text class="small" x="450" y="317" text-anchor="middle">1 epoch = 8 batches = 8 optimizer.step() calls</text></svg>
