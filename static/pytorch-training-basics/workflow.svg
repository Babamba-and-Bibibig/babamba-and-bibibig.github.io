<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="title desc"><title id="title">One batch: clear, forward, loss, backward, update</title><desc id="desc">Inputs go to the model and targets to the loss. Backward computes gradients; the optimizer updates parameters.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:23px}.code{font-family:monospace;font-size:22px}.small{font-size:19px}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><rect width="900" height="630" rx="18" fill="#f8fafc"/><text x="40" y="43" font-size="26" font-weight="bold">1 BATCH</text><rect class="box" x="235" y="70" width="405" height="64" rx="12"/><text class="code" x="437" y="110" text-anchor="middle">optimizer.zero_grad()</text><text class="small" x="665" y="109">.grad = None</text><path class="arrow" d="M437 134V163"/><rect class="box" x="235" y="174" width="405" height="64" rx="12"/><text class="code" x="437" y="214" text-anchor="middle">logits = model(xb)</text><text x="65" y="214">xb</text><path class="arrow" d="M112 206H222"/><text class="small" x="665" y="213">(B, C)</text><path class="arrow" d="M437 238V267"/><rect class="box" x="235" y="278" width="405" height="64" rx="12"/><text class="code" x="437" y="318" text-anchor="middle">loss = criterion(logits, yb)</text><text x="65" y="318">yb</text><path class="arrow" d="M112 310H222"/><text class="small" x="665" y="317">loss: ()</text><path class="arrow" d="M437 342V371"/><rect x="235" y="382" width="405" height="64" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="code" x="437" y="422" text-anchor="middle">loss.backward()</text><text class="small" x="665" y="421">parameter.grad</text><path class="arrow" d="M437 446V475"/><rect x="235" y="486" width="405" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="code" x="437" y="526" text-anchor="middle">optimizer.step()</text><text class="small" x="665" y="525">w, b → new values</text><path class="arrow" d="M437 550V587"/><text class="code" x="437" y="614" text-anchor="middle">next batch</text></svg>
