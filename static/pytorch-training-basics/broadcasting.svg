<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Broadcasting all combinations versus matched errors</title><desc id="desc">A vector minus a column creates nine errors for three samples. Matching columns produce three errors.</desc><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:24px}.code{font-family:monospace;font-size:23px}.small{font-size:20px}.line{stroke:#94a3b8;stroke-width:1.5}</style><rect width="900" height="640" rx="18" fill="#f8fafc"/><text class="code" x="40" y="48" font-weight="bold">(3,) - (3, 1) → (3, 3)</text><rect x="305" y="75" width="540" height="55" rx="9" fill="#dbeafe"/><text class="code" x="395" y="111" text-anchor="middle">p₁</text><text class="code" x="575" y="111" text-anchor="middle">p₂</text><text class="code" x="755" y="111" text-anchor="middle">p₃</text><rect x="115" y="150" width="130" height="180" rx="9" fill="#fee2e2"/><text class="code" x="180" y="190" text-anchor="middle">t₁</text><text class="code" x="180" y="250" text-anchor="middle">t₂</text><text class="code" x="180" y="310" text-anchor="middle">t₃</text><rect x="305" y="150" width="540" height="180" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="305" y="150" width="180" height="60" fill="#dcfce7"/><rect x="485" y="210" width="180" height="60" fill="#dcfce7"/><rect x="665" y="270" width="180" height="60" fill="#dcfce7"/><path class="line" d="M485 150V330M665 150V330M305 210H845M305 270H845"/><text class="code" x="395" y="190" text-anchor="middle">p₁-t₁</text><text class="code" x="575" y="190" text-anchor="middle">p₂-t₁</text><text class="code" x="755" y="190" text-anchor="middle">p₃-t₁</text><text class="code" x="395" y="250" text-anchor="middle">p₁-t₂</text><text class="code" x="575" y="250" text-anchor="middle">p₂-t₂</text><text class="code" x="755" y="250" text-anchor="middle">p₃-t₂</text><text class="code" x="395" y="310" text-anchor="middle">p₁-t₃</text><text class="code" x="575" y="310" text-anchor="middle">p₂-t₃</text><text class="code" x="755" y="310" text-anchor="middle">p₃-t₃</text><text class="small" x="115" y="365">3 × 3 = 9</text><path d="M35 395H865" stroke="#cbd5e1" stroke-width="2"/><text class="code" x="40" y="435" font-weight="bold">(3, 1) - (3, 1) → (3, 1)</text><rect x="100" y="460" width="150" height="150" rx="9" fill="#dbeafe"/><rect x="365" y="460" width="150" height="150" rx="9" fill="#fee2e2"/><rect x="630" y="460" width="210" height="150" rx="9" fill="#dcfce7"/><text class="code" x="175" y="498" text-anchor="middle">[p₁]</text><text class="code" x="175" y="545" text-anchor="middle">[p₂]</text><text class="code" x="175" y="592" text-anchor="middle">[p₃]</text><text x="308" y="545" text-anchor="middle">−</text><text class="code" x="440" y="498" text-anchor="middle">[t₁]</text><text class="code" x="440" y="545" text-anchor="middle">[t₂]</text><text class="code" x="440" y="592" text-anchor="middle">[t₃]</text><text x="573" y="545" text-anchor="middle">=</text><text class="code" x="735" y="498" text-anchor="middle">[p₁-t₁]</text><text class="code" x="735" y="545" text-anchor="middle">[p₂-t₂]</text><text class="code" x="735" y="592" text-anchor="middle">[p₃-t₃]</text></svg>
