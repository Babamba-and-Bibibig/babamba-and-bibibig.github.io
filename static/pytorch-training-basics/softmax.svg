<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc"><title id="title">Softmax keeps each sample separate</title><desc id="desc">Exponentials a b c share sum s1; d e f share sum s2. Dividing each row by its sum gives probabilities with unchanged shape.</desc><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:24px}.code{font-family:monospace;font-size:23px}.small{font-size:20px}</style><rect width="900" height="430" rx="18" fill="#f8fafc"/><text class="code" x="40" y="45">sum(dim=1, keepdim=True): (2, 3) → (2, 1)</text><text class="code" x="160" y="103" text-anchor="middle">exp_logits</text><text class="code" x="405" y="103" text-anchor="middle">row_sums</text><text class="code" x="695" y="103" text-anchor="middle">probs</text><rect x="35" y="125" width="250" height="125" rx="10" fill="#dbeafe"/><text class="code" x="160" y="170" text-anchor="middle">[a, b, c]</text><text class="code" x="160" y="225" text-anchor="middle">[d, e, f]</text><text x="317" y="197" text-anchor="middle">÷</text><rect x="350" y="125" width="110" height="125" rx="10" fill="#fef3c7"/><text class="code" x="405" y="170" text-anchor="middle">[s₁]</text><text class="code" x="405" y="225" text-anchor="middle">[s₂]</text><text x="497" y="197" text-anchor="middle">=</text><rect x="535" y="125" width="330" height="125" rx="10" fill="#dcfce7"/><text class="code" x="700" y="170" text-anchor="middle">[a/s₁, b/s₁, c/s₁]</text><text class="code" x="700" y="225" text-anchor="middle">[d/s₂, e/s₂, f/s₂]</text><text class="code" x="160" y="286" text-anchor="middle">(2, 3)</text><text class="code" x="405" y="286" text-anchor="middle">(2, 1)</text><text class="code" x="700" y="286" text-anchor="middle">(2, 3)</text><text class="code" x="65" y="348">s₁ = a + b + c</text><text class="code" x="65" y="391">s₂ = d + e + f</text><text class="code" x="500" y="348">a/s₁ + b/s₁ + c/s₁ = 1</text><text class="code" x="500" y="391">d/s₂ + e/s₂ + f/s₂ = 1</text></svg>
