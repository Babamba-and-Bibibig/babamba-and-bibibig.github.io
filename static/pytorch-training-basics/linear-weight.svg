<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">Linear stores output neurons by input features</title><desc id="desc">A sixteen-by-two weight matrix is transposed to two-by-sixteen before multiplying a batch-by-two input. Adding a sixteen-element bias yields batch-by-sixteen output.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:24px}.code{font-family:monospace;font-size:23px}.small{font-size:20px}</style><rect width="900" height="480" rx="18" fill="#f8fafc"/><text class="code" x="40" y="45" font-weight="bold">nn.Linear(2, 16)</text><rect x="40" y="75" width="280" height="220" rx="12" fill="#dbeafe"/><text class="code" x="180" y="110" text-anchor="middle">weight: (16, 2)</text><text class="code" x="180" y="155" text-anchor="middle">[w₁₁, w₁₂]</text><text class="code" x="180" y="195" text-anchor="middle">[w₂₁, w₂₂]</text><text class="code" x="180" y="232" text-anchor="middle">…</text><text class="code" x="180" y="275" text-anchor="middle">[w₁₆,₁, w₁₆,₂]</text><path d="M340 180H420" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><text class="code" x="380" y="157" text-anchor="middle">.T</text><rect x="445" y="75" width="415" height="220" rx="12" fill="#dcfce7"/><text class="code" x="652" y="110" text-anchor="middle">weight.T: (2, 16)</text><text class="code" x="652" y="175" text-anchor="middle">[w₁₁, w₂₁, …, w₁₆,₁]</text><text class="code" x="652" y="235" text-anchor="middle">[w₁₂, w₂₂, …, w₁₆,₂]</text><text class="small" x="450" y="337" text-anchor="middle">X @ weight.T + bias = Z1</text><rect x="35" y="360" width="180" height="78" rx="10" fill="#e0e7ff"/><text class="code" x="125" y="408" text-anchor="middle">(B, 2)</text><text class="code" x="249" y="408" text-anchor="middle">@</text><rect x="285" y="360" width="180" height="78" rx="10" fill="#dcfce7"/><text class="code" x="375" y="408" text-anchor="middle">(2, 16)</text><text class="code" x="495" y="408" text-anchor="middle">+</text><text class="code" x="565" y="408" text-anchor="middle">(16,)</text><text class="code" x="650" y="408" text-anchor="middle">=</text><rect x="690" y="360" width="175" height="78" rx="10" fill="#dbeafe"/><text class="code" x="777" y="408" text-anchor="middle">(B, 16)</text></svg>
