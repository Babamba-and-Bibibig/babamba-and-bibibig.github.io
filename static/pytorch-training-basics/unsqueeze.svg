<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">unsqueeze changes shape, not element count</title><desc id="desc">A vector of N elements becomes shape one by N with unsqueeze zero, or N by one with unsqueeze one.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:24px}.code{font-family:monospace;font-size:24px}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><rect width="900" height="450" rx="18" fill="#f8fafc"/><rect x="260" y="30" width="380" height="75" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="code" x="450" y="61" text-anchor="middle">x: (N,)</text><text class="code" x="450" y="91" text-anchor="middle">[x₁, x₂, …, xₙ]</text><path class="arrow" d="M365 105L215 206"/><path class="arrow" d="M535 105L685 206"/><text class="code" x="40" y="168">x.unsqueeze(0)</text><text class="code" x="650" y="160">x.unsqueeze(1)</text><rect x="35" y="220" width="365" height="175" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="code" x="217" y="259" text-anchor="middle">(1, N)</text><text class="code" x="217" y="313" text-anchor="middle">[[x₁, x₂, …, xₙ]]</text><text x="217" y="363" text-anchor="middle">1 × N</text><rect x="500" y="220" width="365" height="195" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="code" x="682" y="255" text-anchor="middle">(N, 1)</text><text class="code" x="682" y="290" text-anchor="middle">[[x₁],</text><text class="code" x="682" y="322" text-anchor="middle"> [x₂],</text><text class="code" x="682" y="353" text-anchor="middle"> …</text><text class="code" x="682" y="388" text-anchor="middle"> [xₙ]]</text></svg>
