<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Passing a function does not call it</title><desc id="desc">An optimizer factory is passed to train_with. The training function creates a model, supplies its parameters to the factory, and receives an SGD object. No recursive call occurs.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#475569"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#172554;font-size:23px}.code{font-family:monospace;font-size:21px}.small{font-size:19px}.arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style><rect width="900" height="650" rx="18" fill="#f8fafc"/><rect x="30" y="28" width="840" height="68" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="code" x="450" y="70" text-anchor="middle">make_sgd = lambda p: torch.optim.SGD(p, lr=0.01)</text><path class="arrow" d="M250 96V132"/><rect x="35" y="145" width="440" height="65" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="code" x="255" y="185" text-anchor="middle">train_with(make_sgd)</text><text class="small" x="520" y="185">optimizer_fn = make_sgd</text><path class="arrow" d="M255 210V246"/><rect x="35" y="260" width="440" height="65" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="code" x="255" y="300" text-anchor="middle">model = MLP()</text><path class="arrow" d="M255 325V361"/><rect x="35" y="375" width="440" height="75" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="code" x="255" y="420" text-anchor="middle">optimizer_fn(model.parameters())</text><path class="arrow" d="M475 412H535"/><rect x="550" y="375" width="315" height="75" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text class="code" x="707" y="407" text-anchor="middle">p</text><text class="small" x="707" y="435" text-anchor="middle">parameter iterator</text><path class="arrow" d="M707 450V486"/><rect x="550" y="500" width="315" height="75" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text class="code" x="707" y="532" text-anchor="middle">torch.optim.SGD(</text><text class="code" x="707" y="559" text-anchor="middle">p, lr=0.01)</text><path class="arrow" d="M550 537H489"/><text class="small" x="510" y="510" text-anchor="middle">return</text><rect x="35" y="500" width="440" height="75" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="code" x="255" y="545" text-anchor="middle">optimizer: SGD object</text><text class="small" x="450" y="622" text-anchor="middle">function definition → argument binding → function call → returned object</text></svg>
