<svg xmlns="http://www.w3.org/2000/svg" width="520" height="632" viewBox="0 0 520 632" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">노드 세 개를 가진 첫 번째 보정 트리</title><desc id="desc">파란 테두리 전체가 결정트리 1개다. 노드 0인 루트의 깊이는 0이며 역세권 값이 0.5 이하인지 확인한다. 조건이 참이면 역세권 값 0인 집 A와 B가 노드 1 리프에 도달하고 -4를 출력한다. 거짓이면 값 1인 집 C와 D가 노드 2 리프에 도달하고 +4를 출력한다. 두 리프의 깊이는 1이다. 루트부터 리프까지 한 번 분기하며 전체 노드는 3개다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#627c7c"/></marker></defs>
<rect width="520" height="632" rx="14" fill="#f5f8f6"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif" text-anchor="middle">
<text x="260" y="43" font-size="27" font-weight="750" fill="#192d34">하나의 완성된 보정 트리</text>
<text x="260" y="79" font-size="23" font-weight="400" fill="#52656b">집값에 더할 보정값을 출력합니다</text>
<rect x="14" y="104" width="492" height="452" rx="10" fill="#eef6fb" stroke="#135b91" stroke-width="2"/>
<text x="260" y="141" font-size="26" font-weight="750" fill="#135b91">트리 1 전체</text>
<rect x="70" y="165" width="380" height="117" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="260" y="197" font-size="24" font-weight="650" fill="#192d34">루트 · 노드 0</text>
<text x="260" y="230" font-size="26" font-weight="700" fill="#192d34">역세권 ≤ 0.5</text>
<text x="260" y="263" font-size="23" font-weight="400" fill="#52656b">깊이 0</text>
<path d="M260 282 L136 369" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M260 282 L384 369" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<text x="115" y="327" font-size="22" font-weight="600" fill="#192d34">참 · 값 0</text>
<text x="405" y="327" font-size="22" font-weight="600" fill="#192d34">거짓 · 값 1</text>
<rect x="28" y="369" width="216" height="161" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="136" y="403" font-size="24" font-weight="650" fill="#192d34">리프 · 노드 1</text>
<text x="136" y="436" font-size="23" font-weight="400" fill="#192d34">집 A, B</text>
<text x="136" y="478" font-size="36" font-weight="750" fill="#135b91">−4</text>
<text x="136" y="515" font-size="23" font-weight="400" fill="#52656b">깊이 1</text>
<rect x="276" y="369" width="216" height="161" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="384" y="403" font-size="24" font-weight="650" fill="#192d34">리프 · 노드 2</text>
<text x="384" y="436" font-size="23" font-weight="400" fill="#192d34">집 C, D</text>
<text x="384" y="478" font-size="36" font-weight="750" fill="#135b91">+4</text>
<text x="384" y="515" font-size="23" font-weight="400" fill="#52656b">깊이 1</text>
<text x="260" y="592" font-size="27" font-weight="750" fill="#192d34">노드 3개 · 결정트리 1개</text>
<text x="260" y="623" font-size="23" font-weight="400" fill="#52656b">루트에서 리프까지 연결 1개를 지납니다</text>
</g></svg>