<svg xmlns="http://www.w3.org/2000/svg" width="520" height="1940" viewBox="0 0 520 1940" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">랜덤 포레스트와 그래디언트 부스팅의 학습 흐름</title><desc id="desc">제곱오차 회귀 예시. 랜덤 포레스트는 서로 다르게 복원추출한 표본으로 각 트리 전체를 따로 학습한다. 같은 집을 각 트리로 예측한 뒤 그 예측값들을 평균낸다. 그래디언트 부스팅은 초기 평균에서 시작하여 잔차 계산, 새 트리 전체 학습, 보정값 예측, 전체 예측 갱신을 반복한다. 그림 안의 루트와 두 리프는 완전한 트리 한 개의 구조 예시다. 실제 트리의 크기는 설정과 학습 결과에 따라 달라진다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#627c7c"/></marker></defs>
<rect width="520" height="1940" rx="14" fill="#f5f8f6"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif" text-anchor="middle">
<text x="260" y="45" font-size="29" font-weight="750" fill="#192d34">회귀 랜덤 포레스트</text>
<text x="260" y="80" font-size="24" font-weight="400" fill="#52656b">각 트리의 예측을 평균내기</text>
<rect x="40" y="104" width="440" height="84" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="260" y="140" font-size="24" font-weight="650" fill="#192d34">같은 원본 학습자료</text>
<text x="260" y="174" font-size="24" font-weight="400" fill="#192d34">[A, B, C, D]</text>
<path d="M260 188 V213 H130 V237" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M260 213 H390 V237" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="240" width="220" height="82" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="130" y="273" font-size="23" font-weight="650" fill="#192d34">복원추출 표본 1</text>
<text x="130" y="305" font-size="24" font-weight="400" fill="#192d34">[A, A, C, D]</text>
<path d="M130 322 V347" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="20" y="351" width="220" height="261" rx="10" fill="#eef6fb" stroke="#135b91" stroke-width="2"/>
<text x="130" y="386" font-size="26" font-weight="750" fill="#135b91">트리 1</text>
<text x="130" y="420" font-size="23" font-weight="400" fill="#192d34">전체를 fit()</text>
<rect x="80" y="443" width="100" height="43" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="130" y="472" font-size="24" font-weight="600" fill="#192d34">루트</text>
<path d="M130 486 L78 546" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M130 486 L182 546" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="37" y="546" width="82" height="45" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="78" y="577" font-size="23" font-weight="400" fill="#192d34">리프</text>
<rect x="141" y="546" width="82" height="45" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="182" y="577" font-size="23" font-weight="400" fill="#192d34">리프</text>
<rect x="280" y="240" width="220" height="82" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="390" y="273" font-size="23" font-weight="650" fill="#192d34">복원추출 표본 2</text>
<text x="390" y="305" font-size="24" font-weight="400" fill="#192d34">[B, C, C, A]</text>
<path d="M390 322 V347" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="280" y="351" width="220" height="261" rx="10" fill="#eef6fb" stroke="#135b91" stroke-width="2"/>
<text x="390" y="386" font-size="26" font-weight="750" fill="#135b91">트리 2</text>
<text x="390" y="420" font-size="23" font-weight="400" fill="#192d34">전체를 fit()</text>
<rect x="340" y="443" width="100" height="43" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="390" y="472" font-size="24" font-weight="600" fill="#192d34">루트</text>
<path d="M390 486 L338 546" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M390 486 L442 546" fill="none" stroke="#135b91" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="297" y="546" width="82" height="45" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="338" y="577" font-size="23" font-weight="400" fill="#192d34">리프</text>
<rect x="401" y="546" width="82" height="45" rx="10" fill="#fff" stroke="#135b91" stroke-width="2"/>
<text x="442" y="577" font-size="23" font-weight="400" fill="#192d34">리프</text>
<path d="M130 612 V642 H260 V665" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M390 612 V642 H260" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="40" y="670" width="440" height="89" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="260" y="706" font-size="24" font-weight="600" fill="#192d34">같은 집의 정보 → 각 트리</text>
<text x="260" y="740" font-size="24" font-weight="400" fill="#192d34">predict()로 각각 예측</text>
<path d="M260 759 V782" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="24" y="787" width="472" height="85" rx="10" fill="#e3eee7" stroke="#1b6c4c" stroke-width="2"/>
<text x="260" y="823" font-size="24" font-weight="650" fill="#174e3b">각 트리의 예측값을 평균냅니다</text>
<text x="260" y="856" font-size="24" font-weight="400" fill="#192d34">그 평균이 최종 집값 예측입니다</text>
<text x="260" y="899" font-size="23" font-weight="400" fill="#52656b">각 분기의 후보 컬럼 수는</text>
<text x="260" y="928" font-size="23" font-weight="400" fill="#52656b">설정으로 정합니다</text>
<path d="M24 938 H496" stroke="#bdcfcf" stroke-width="2"/>
<text x="260" y="984" font-size="29" font-weight="750" fill="#192d34">회귀 그래디언트 부스팅</text>
<text x="260" y="1021" font-size="24" font-weight="400" fill="#52656b">제곱오차를 줄이는 새 트리 추가</text>
<rect x="28" y="1054" width="408" height="88" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="232" y="1090" font-size="26" font-weight="650" fill="#192d34">초기 예측</text>
<text x="232" y="1124" font-size="24" font-weight="400" fill="#192d34">학습 정답의 평균</text>
<path d="M232 1142 V1165" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="1170" width="408" height="88" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="232" y="1206" font-size="25" font-weight="650" fill="#192d34">1. 현재 잔차 계산</text>
<text x="232" y="1240" font-size="24" font-weight="400" fill="#192d34">정답 − 현재 전체 예측</text>
<path d="M232 1258 V1282" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="1287" width="408" height="278" rx="10" fill="#fff9ed" stroke="#825110" stroke-width="2"/>
<text x="232" y="1325" font-size="25" font-weight="650" fill="#825110">2. 새 트리 1개 전체 학습</text>
<text x="232" y="1362" font-size="24" font-weight="400" fill="#192d34">fit(X, 현재 잔차)</text>
<rect x="65" y="1380" width="332" height="160" rx="10" fill="#fff" stroke="#825110" stroke-width="2"/>
<rect x="177" y="1392" width="110" height="45" rx="10" fill="#fff" stroke="#825110" stroke-width="2"/>
<text x="232" y="1423" font-size="24" font-weight="600" fill="#192d34">루트</text>
<path d="M232 1437 L143 1481" fill="none" stroke="#825110" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M232 1437 L321 1481" fill="none" stroke="#825110" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="91" y="1481" width="104" height="44" rx="10" fill="#fff" stroke="#825110" stroke-width="2"/>
<text x="143" y="1512" font-size="24" font-weight="400" fill="#192d34">리프</text>
<rect x="269" y="1481" width="104" height="44" rx="10" fill="#fff" stroke="#825110" stroke-width="2"/>
<text x="321" y="1512" font-size="24" font-weight="400" fill="#192d34">리프</text>
<path d="M232 1565 V1588" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="1593" width="408" height="88" rx="10" fill="#fff" stroke="#bdcfcf" stroke-width="2"/>
<text x="232" y="1629" font-size="25" font-weight="650" fill="#192d34">3. 보정값 예측</text>
<text x="232" y="1663" font-size="24" font-weight="400" fill="#192d34">새 트리의 predict(X)</text>
<path d="M232 1681 V1704" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="28" y="1709" width="408" height="118" rx="10" fill="#e3eee7" stroke="#1b6c4c" stroke-width="2"/>
<text x="232" y="1745" font-size="25" font-weight="650" fill="#174e3b">4. 전체 예측 갱신</text>
<text x="232" y="1779" font-size="24" font-weight="400" fill="#192d34">현재 예측 + 학습률 × 보정값</text>
<text x="232" y="1812" font-size="24" font-weight="400" fill="#192d34">학습한 트리는 따로 보관</text>
<path d="M436 1768 H480 V1214 H440" fill="none" stroke="#627c7c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="447" y="1410" width="65" height="77" rx="5" fill="#f5f8f6"/>
<text x="480" y="1441" font-size="23" font-weight="650" fill="#192d34">다음</text>
<text x="480" y="1472" font-size="23" font-weight="650" fill="#192d34">트리</text>
<text x="260" y="1877" font-size="23" font-weight="600" fill="#192d34">매 반복마다 별도 새 트리 1개를 추가합니다</text>
<text x="260" y="1913" font-size="23" font-weight="400" fill="#52656b">학습률을 반영한 보정값을 합칩니다</text>
</g></svg>
