<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Six splits, six fresh training runs</title>
<desc id="desc">144 pairs are split into six groups A through F, each with 24 pairs. Each fold holds out one group for validation and trains a fresh model on the other 120 pairs. Within a fold, the train and validation memberships stay fixed across epochs.</desc>
