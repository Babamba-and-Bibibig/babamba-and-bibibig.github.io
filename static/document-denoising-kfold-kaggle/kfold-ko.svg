<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">6개 분할, 6번의 새 학습</title>
<desc id="desc">144쌍을 각 24쌍의 A부터 F 그룹으로 나눈 예. 각 Fold에서 한 그룹 24쌍을 검증에 두고 나머지 다섯 그룹 120쌍으로 새 모델을 학습한다. 같은 Fold의 Epoch가 반복되는 동안 학습과 검증에 속한 원본 이미지 구성은 유지된다.</desc>
