<svg xmlns="http://www.w3.org/2000/svg" width="500" height="938" viewBox="0 0 500 938" role="img" aria-labelledby="figure-title figure-desc" xml:lang="en">
  <title id="figure-title">A neural-network learning process usable for both regression and classification</title>
  <desc id="figure-desc">This diagram covers neural networks trained with gradient descent. Step 1 is input information, step 2 is model computation, step 3 compares predictions with recorded answers, step 4 calculates a loss suited to the prediction goal, and step 5 calculates gradients and updates weights and biases. The return arrow goes from step 5 to step 2, where the model calculates again using the updated weights and biases. Training does not alter the input data or recorded answers.</desc>
  <defs>
    <marker id="step-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#64748b"/></marker>
    <marker id="repeat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#334155"/></marker>
  </defs>
  <rect width="500" height="938" rx="14" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, Noto Sans CJK KR, sans-serif" text-anchor="middle">
    <text x="250" y="39" fill="#0f172a" font-size="24" font-weight="700">Training a neural network</text>
    <text x="250" y="70" fill="#0f172a" font-size="24" font-weight="700">with gradient descent</text>
    <g fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#step-arrow)">
      <path id="step-1-to-2" d="M222 218 V240"/>
      <path id="step-2-to-3" d="M222 360 V382"/>
      <path id="step-3-to-4" d="M222 502 V524"/>
      <path id="step-4-to-5" d="M222 664 V686"/>
    </g>
    <path id="repeat-from-parameter-update-to-model-computation" d="M420 762 H464 V301 H422" fill="none" stroke="#334155" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#repeat-arrow)"/>
    <g id="step-1">
      <rect x="24" y="104" width="396" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="222" y="141" fill="#0f172a" font-size="24" font-weight="700">1. Input information</text>
      <text x="222" y="172" fill="#334155" font-size="22">Delivery distance and</text>
      <text x="222" y="200" fill="#334155" font-size="22">information known at departure</text>
    </g>
    <g id="step-2">
      <rect x="24" y="246" width="396" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="222" y="283" fill="#0f172a" font-size="24" font-weight="700">2. Model computation</text>
      <text x="222" y="314" fill="#334155" font-size="22">Use weights and biases</text>
      <text x="222" y="342" fill="#334155" font-size="22">to predict from the inputs</text>
    </g>
    <g id="step-3">
      <rect x="24" y="388" width="396" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="222" y="425" fill="#0f172a" font-size="24" font-weight="700">3. Predictions and answers</text>
      <text x="222" y="456" fill="#334155" font-size="22">Compare model predictions</text>
      <text x="222" y="484" fill="#334155" font-size="22">with the recorded actual answers</text>
    </g>
    <g id="step-4">
      <rect x="24" y="530" width="396" height="130" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
      <text x="222" y="573" fill="#9a3412" font-size="24" font-weight="700">4. Loss calculation</text>
      <text x="222" y="604" fill="#334155" font-size="22">Match the loss to the</text>
      <text x="222" y="632" fill="#334155" font-size="22">regression or classification goal</text>
    </g>
    <g id="step-5">
      <rect x="24" y="692" width="396" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="222" y="735" fill="#0f172a" font-size="24" font-weight="700">5. Gradients and update</text>
      <text x="222" y="766" fill="#334155" font-size="22">Get gradients; update weights</text>
      <text x="222" y="794" fill="#334155" font-size="22">and biases to reduce the loss</text>
    </g>
    <rect x="428" y="472" width="71" height="40" rx="6" fill="#f8fafc"/>
    <text x="464" y="499" fill="#334155" font-size="19" font-weight="600">Again</text>
    <text x="250" y="880" fill="#334155" font-size="22">Use the updated weights and biases</text>
    <text x="250" y="910" fill="#334155" font-size="22">and repeat from step 2.</text>
  </g>
</svg>
