<main id="lab">

<h1>값이 컬럼 이름이 되면 무엇이 달라질까?</h1>
<p class="intro">버튼을 누르면 왼쪽 표의 값이 오른쪽 표로 이동한다. 숫자의 이동과 카테고리 이름의 이동을 따로 보자. 슬라이더를 움직이면 중간에서 멈출 수 있다.</p>

<button type="button" data-mode="melt">③ melt · 컬럼 → 값</button>
<button type="button" data-mode="stats">고객별 지표 만들기</button>
<button type="button" data-mode="swap">비교 대상 바꾸기</button>

<div class="purpose"><b id="question"></b><span id="purpose"></span></div>

<p class="hint">왼쪽은 변환 전, 오른쪽은 변환 후다. 좁은 화면에서는 그림을 좌우로 밀어 볼 수 있다. 이동 중인 조각은 출처를 보여주는 표시이며, 새 거래가 아니다.</p>

 group:{src:raw,dst:pairs,left:'한 행 = 금액 기록 하나',right:'한 행 = 고객 × 카테고리',question:'같은 고객이 같은 종류에 쓴 돈을 합치려면?',purpose:'구분 기준은 customer_id + category. 여러 기록을 한 합계로 바꾼다.',phases:[['묶을 기준을 정한다','101번 고객의 food 두 기록은 같은 그룹이다. record_id가 다르므로 원본에서는 서로 다른 기록이다.'],['같은 그룹의 금액이 한 칸으로 모인다','10,000원과 5,000원을 더해 15,000원을 만든다. 이 단계는 위치만 바꾸는 것이 아니라 계산하는 단계다.'],['개별 기록 대신 합계가 남는다','101 × food의 15,000원만으로 원래 두 금액을 되찾을 수 없다. record_id와 개별 금액은 이 결과에서 사라졌다.']],result:'기록 6행 → 관측된 고객·카테고리 5행. 전체 금액 77,000원은 같지만 기록의 세부 내역은 요약된다.'},

function node(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e;}

}
function flight(sr,sc,dr,dc,label,tint,delay=0){const m=modes[mode],a=position(m.src,0,sr,sc),b=position(m.dst,1,dr,dc),g=node('g'),w=Math.max(62,label.length*7.2+16);g.append(node('rect',{x:-w/2,y:-15,width:w,height:30,rx:7,fill:'var(--bg)',stroke:tint||color(label),'stroke-width':1.8}));g.append(node('text',{'text-anchor':'middle',y:4,fill:tint||color(label),'font-size':12.5,'font-family':'ui-monospace,monospace','font-weight':700},label));$('board').append(g);flights.push({g,a,b,delay});}

function staticTables(){const box=$('static');box.replaceChildren();[['변환 전',modes[mode].src],['변환 후',modes[mode].dst]].forEach(([label,t])=>{const table=document.createElement('table');const cap=table.createCaption();cap.textContent=label;const head=table.createTHead().insertRow();t.headers.forEach(h=>{const th=document.createElement('th');th.scope='col';th.textContent=h;head.append(th);});const body=table.createTBody();t.rows.forEach(r=>{const row=body.insertRow();r.forEach(v=>{row.insertCell().textContent=v;});});box.append(table);});}
function paint(){progress=Math.max(0,Math.min(1,progress));$('progress').value=Math.round(progress*1000);$('percent').value=Math.round(progress*100)+'%';const show=Math.max(0,Math.min(1,(progress-.72)/.16));destCells.forEach(e=>e.setAttribute('opacity',.13+.87*show));for(const f of flights){const t=Math.max(0,Math.min(1,(progress-.08-f.delay*.55)/.47)),ease=t*t*(3-2*t),x=f.a.x+(f.b.x-f.a.x)*ease,y=f.a.y+(f.b.y-f.a.y)*ease-45*Math.sin(Math.PI*t);f.g.setAttribute('transform',`translate(${x} ${y})`);f.g.setAttribute('opacity',t<=0||progress>=.88?0:Math.min(1,t*12,Math.max(0,(.88-progress)*12)));}const current=progress<.19?0:progress<.81?1:2;if(current!==phase){phase=current;$('phase').textContent=modes[mode].phases[current][0];$('explain').textContent=modes[mode].phases[current][1];}}

function tick(now){if(!playing)return;progress+=(now-last)/6500*Number($('speed').value);last=now;paint();if(progress>=1)pause();else raf=requestAnimationFrame(tick);}
function play(){if(progress>=1)progress=0;playing=true;last=performance.now();$('play').textContent='일시정지';raf=requestAnimationFrame(tick);}
function select(next,auto=true){pause();mode=next;progress=0;phase=-1;flights=[];destCells=[];const m=modes[mode];$('board').replaceChildren(node('title',{id:'svg-title'},m.question),node('desc',{id:'svg-desc'},m.purpose));drawTable(m.src,0,m.left);drawTable(m.dst,1,m.right);$('board').append(node('text',{x:480,y:220,'text-anchor':'middle',fill:'var(--id)','font-size':28},'→'));makeFlights();$('question').textContent=m.question;$('purpose').textContent=m.purpose;$('result').textContent=m.result;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));staticTables();if(reduce.matches)progress=1;paint();if(auto&&!reduce.matches)play();}
// 사용자가 직접 재생하거나 진행 위치를 바꿀 수 있다. 자동 반복은 하지 않는다.
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));
$('play').addEventListener('click',()=>playing?pause():play());$('replay').addEventListener('click',()=>{pause();progress=0;paint();play();});$('progress').addEventListener('input',()=>{pause();progress=Number($('progress').value)/1000;paint();});$('theme').addEventListener('click',()=>document.documentElement.toggleAttribute('data-light'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
// 프레임 높이만 내용에 맞춘다. 부모 문서의 CSS·테마·DOM에는 손대지 않는다.
function resize(){try{if(window.frameElement)window.frameElement.style.height=Math.ceil($('lab').getBoundingClientRect().height+2)+'px';}catch(_){}}
new ResizeObserver(resize).observe($('lab'));select('pivot',false);let first=true;new IntersectionObserver(entries=>{if(entries[0].isIntersecting){if(first&&!reduce.matches){first=false;play();}}else pause();},{threshold:.15}).observe($('lab'));
})();
</script>
