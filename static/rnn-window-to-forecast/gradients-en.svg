<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1160" viewBox="0 0 980 1160" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Distinguish two gradient paths at a time step</title><desc id="desc">The final loss supplies gradients to the current hidden state and pre-activation weighted sum. Gradients from parameter uses are added, while the previous-state gradient continues backward through earlier time steps. Each shared parameter receives one accumulated grad value before step updates it.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4d6177"/></marker>
<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14694e"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect width="980" height="1160" rx="20" fill="#f7f9fc"/>

<text x="32" y="47" font-size="29" fill="#183048" font-weight="700" text-anchor="start">Distinguish two gradient paths at a time step</text>
<text x="32" y="83" font-size="19" fill="#4d6177" font-weight="400" text-anchor="start">This diagram follows parameter learning and the path to the previous state.</text>
<rect x="49" y="115" width="882" height="104" rx="12" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.6"/>
<text x="69" y="151" font-size="20" fill="#4d6177" font-weight="400" text-anchor="start">L: final loss · h_t: current hidden state · a_t: sum before tanh</text>
<text x="69" y="185" font-size="20" fill="#4d6177" font-weight="400" text-anchor="start">dL/dh_t: how the loss changes for small changes to hidden-state values</text>
<rect x="253" y="252" width="474" height="73" rx="12" fill="#fcebf0" stroke="#ac3b4d" stroke-width="1.6"/>
<text x="490" y="281" font-size="21" fill="#ac3b4d" font-weight="700" text-anchor="middle">Final loss L → backprop through the head</text>
<text x="490" y="309" font-size="18" fill="#4d6177" font-weight="400" text-anchor="middle">Start from the last hidden state</text>
<path d="M490 325V361" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="253" y="365" width="474" height="72" rx="12" fill="#e8f5ee" stroke="#14694e" stroke-width="1.6"/>
<text x="490" y="395" font-size="21" fill="#14694e" font-weight="700" text-anchor="middle">Gradient with respect to current state</text>
<text x="490" y="424" font-size="22" fill="#183048" font-weight="400" text-anchor="middle" class="mono">dL/dh_t</text>
<path d="M490 437V494" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="511" y="473" font-size="18" fill="#4d6177" font-weight="400" text-anchor="start">Apply the local slope of tanh</text>
<rect x="253" y="499" width="474" height="73" rx="12" fill="#f2ebfb" stroke="#7443a8" stroke-width="1.6"/>
<text x="490" y="531" font-size="21" fill="#7443a8" font-weight="700" text-anchor="middle">Gradient with respect to the weighted sum</text>
<text x="490" y="558" font-size="22" fill="#183048" font-weight="400" text-anchor="middle" class="mono">dL/da_t</text>
<path d="M490 572V607H255V639" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M490 607H737V639" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="643" width="420" height="141" rx="12" fill="#fff4e5" stroke="#bd7a25" stroke-width="1.6"/>
<text x="255" y="680" font-size="20" fill="#895414" font-weight="700" text-anchor="middle">Compute gradients from parameter</text>
<text x="255" y="707" font-size="20" fill="#895414" font-weight="700" text-anchor="middle">uses at this time step.</text>
<text x="255" y="734" font-size="20" fill="#895414" font-weight="700" text-anchor="middle"></text>
<text x="255" y="761" font-size="20" fill="#895414" font-weight="700" text-anchor="middle">W_ih · W_hh · b_ih · b_hh</text>
<rect x="525" y="643" width="410" height="141" rx="12" fill="#e8f5ee" stroke="#14694e" stroke-width="1.6"/>
<text x="730" y="681" font-size="20" fill="#14694e" font-weight="700" text-anchor="middle">Compute the gradient to pass</text>
<text x="730" y="708" font-size="20" fill="#14694e" font-weight="700" text-anchor="middle">to the previous hidden state.</text>
<text x="730" y="735" font-size="20" fill="#14694e" font-weight="700" text-anchor="middle"></text>
<text x="730" y="762" font-size="20" fill="#14694e" font-weight="700" text-anchor="middle">dL/dh_(t-1)</text>
<path d="M730 784V820H942V401H732" fill="none" stroke="#14694e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green-arrow)"/>
<rect x="659" y="835" width="277" height="100" rx="12" fill="#ffffff" stroke="#c4d4cc" stroke-width="1.6"/>
<text x="797" y="866" font-size="17" fill="#14694e" font-weight="400" text-anchor="middle">Move to the previous step</text>
<text x="797" y="893" font-size="17" fill="#14694e" font-weight="400" text-anchor="middle">Repeat with t replaced by t−1</text>
<text x="797" y="920" font-size="17" fill="#14694e" font-weight="400" text-anchor="middle">The same W_hh is reused</text>
<path d="M255 784V842" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="846" width="536" height="113" rx="12" fill="#fff4e5" stroke="#bd7a25" stroke-width="1.6"/>
<text x="313" y="883" font-size="19" fill="#895414" font-weight="400" text-anchor="middle">Add gradients from every use of the same parameter</text>
<text x="313" y="912" font-size="19" fill="#895414" font-weight="400" text-anchor="middle">Include the whole batch → parameter.grad</text>
<text x="313" y="941" font-size="19" fill="#895414" font-weight="400" text-anchor="middle">Each parameter element has a matching grad element.</text>
<path d="M313 959V999" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="45" y="1003" width="536" height="79" rx="12" fill="#e8f5ee" stroke="#14694e" stroke-width="1.6"/>
<text x="313" y="1035" font-size="23" fill="#14694e" font-weight="700" text-anchor="middle" class="mono">optimizer.step()</text>
<text x="313" y="1066" font-size="19" fill="#183048" font-weight="400" text-anchor="middle">This is where weights and biases are updated.</text>
<text x="32" y="1126" font-size="20" fill="#4d6177" font-weight="400" text-anchor="start">backward() computes gradients; it does not update weights separately at each time step.</text>
</svg>
