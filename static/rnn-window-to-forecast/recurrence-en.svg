<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1180" viewBox="0 0 980 1180" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Shared weights, separate hidden states</title><desc id="desc">Two overlapping visitor windows share model parameters but never pass hidden states to each other. Each time step uses its current input and its own four previous state values.</desc>
