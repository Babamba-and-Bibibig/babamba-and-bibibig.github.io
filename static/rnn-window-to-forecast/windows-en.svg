<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Three input days and the next-day target</title><desc id="desc">Seven observations make four three-day input windows paired with the next-day target. A window starting at index 4 has no observed next-day target.</desc>
