<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1180" viewBox="0 0 980 1180" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">같은 가중치, 샘플마다 다른 은닉 상태</title><desc id="desc">겹치는 방문자 입력창 두 개가 같은 파라미터로 처리되지만 은닉 상태를 서로 전달하지 않는다. 각 시점은 현재 입력 하나와 자기 이전 상태 네 값을 받아 새 상태 네 값을 계산한다.</desc>
