<svg xmlns="http://www.w3.org/2000/svg" width="980" height="810" viewBox="0 0 980 810" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Split by target date: past versus future</title><desc id="desc">With 84 daily observations, target indices 14–55 make 42 training windows, 56–69 make 14 validation windows, and 70–83 make 14 test windows. Each forecast uses only the 14 already-observed prior days.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4d6177"/></marker>
<marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14694e"/></marker>
</defs>
<style>text{font-family:"Noto Sans CJK KR","Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums}.mono{font-family:"DejaVu Sans Mono",Consolas,monospace}</style>
<rect width="980" height="810" rx="20" fill="#f7f9fc"/>

<text x="32" y="47" font-size="29" fill="#183048" font-weight="700" text-anchor="start">Split by target date: past versus future</text>
<text x="32" y="83" font-size="19" fill="#4d6177" font-weight="400" text-anchor="start">Window length 14 · observe each day, then forecast one day ahead</text>
<rect x="45" y="130" width="144.16666666666669" height="139" rx="9" fill="#edf1f6" stroke="#8396ae" stroke-width="1.6"/>
<text x="117.08333333333334" y="166" font-size="18" fill="#8396ae" font-weight="700" text-anchor="middle">History</text>
<text x="117.08333333333334" y="201" font-size="18" fill="#8396ae" font-weight="700" text-anchor="middle">0–13</text>
<text x="117.08333333333334" y="236" font-size="18" fill="#8396ae" font-weight="700" text-anchor="middle">No targets</text>
<rect x="193.16666666666669" y="130" width="440.5" height="139" rx="9" fill="#eaf2ff" stroke="#215ba0" stroke-width="1.6"/>
<text x="413.4166666666667" y="166" font-size="18" fill="#215ba0" font-weight="700" text-anchor="middle">Training targets</text>
<text x="413.4166666666667" y="201" font-size="18" fill="#215ba0" font-weight="700" text-anchor="middle">14–55</text>
<text x="413.4166666666667" y="236" font-size="18" fill="#215ba0" font-weight="700" text-anchor="middle">42 windows</text>
<rect x="637.6666666666667" y="130" width="144.16666666666669" height="139" rx="9" fill="#e8f5ee" stroke="#14694e" stroke-width="1.6"/>
<text x="709.7500000000001" y="166" font-size="18" fill="#14694e" font-weight="700" text-anchor="middle">Validation</text>
<text x="709.7500000000001" y="201" font-size="18" fill="#14694e" font-weight="700" text-anchor="middle">56–69</text>
<text x="709.7500000000001" y="236" font-size="18" fill="#14694e" font-weight="700" text-anchor="middle">14 windows</text>
<rect x="785.8333333333335" y="130" width="144.16666666666669" height="139" rx="9" fill="#fcebf0" stroke="#ac3b4d" stroke-width="1.6"/>
<text x="857.9166666666669" y="166" font-size="18" fill="#ac3b4d" font-weight="700" text-anchor="middle">Test targets</text>
<text x="857.9166666666669" y="201" font-size="18" fill="#ac3b4d" font-weight="700" text-anchor="middle">70–83</text>
<text x="857.9166666666669" y="236" font-size="18" fill="#ac3b4d" font-weight="700" text-anchor="middle">14 windows</text>
<text x="45" y="306" font-size="21" fill="#4d6177" font-weight="400" text-anchor="start">These windows are selected from that same original history.</text>
<text x="45" y="348" font-size="22" fill="#14694e" font-weight="700" text-anchor="start">First validation forecast</text>
<rect x="45" y="368" width="585" height="86" rx="12" fill="#eaf2ff" stroke="#215ba0" stroke-width="1.6"/>
<text x="337" y="403" font-size="22" fill="#215ba0" font-weight="700" text-anchor="middle">14 already-observed input days</text>
<text x="337" y="436" font-size="20" fill="#183048" font-weight="400" text-anchor="middle" class="mono">original indices 42–55</text>
<path d="M630 411H707" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="713" y="368" width="220" height="86" rx="12" fill="#e8f5ee" stroke="#14694e" stroke-width="1.6"/>
<text x="823" y="403" font-size="20" fill="#14694e" font-weight="700" text-anchor="middle">Next-day target</text>
<text x="823" y="436" font-size="22" fill="#183048" font-weight="400" text-anchor="middle" class="mono">index 56</text>
<text x="45" y="512" font-size="22" fill="#ac3b4d" font-weight="700" text-anchor="start">First test forecast</text>
<rect x="45" y="532" width="585" height="86" rx="12" fill="#eaf2ff" stroke="#215ba0" stroke-width="1.6"/>
<text x="337" y="567" font-size="22" fill="#215ba0" font-weight="700" text-anchor="middle">14 already-observed input days</text>
<text x="337" y="600" font-size="20" fill="#183048" font-weight="400" text-anchor="middle" class="mono">original indices 56–69</text>
<path d="M630 575H707" fill="none" stroke="#4d6177" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="713" y="532" width="220" height="86" rx="12" fill="#fcebf0" stroke="#ac3b4d" stroke-width="1.6"/>
<text x="823" y="567" font-size="20" fill="#ac3b4d" font-weight="700" text-anchor="middle">Next-day target</text>
<text x="823" y="600" font-size="22" fill="#183048" font-weight="400" text-anchor="middle" class="mono">index 70</text>
<rect x="45" y="671" width="889" height="103" rx="12" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.6"/>
<text x="65" y="706" font-size="21" fill="#4d6177" font-weight="400" text-anchor="start">Observed past values may appear in validation and test inputs.</text>
<text x="65" y="742" font-size="21" fill="#4d6177" font-weight="400" text-anchor="start">Future targets never enter training or an earlier forecast’s input.</text>
</svg>
