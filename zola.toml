# 기존 주소와 글은 그대로 유지합니다.
base_url = "https://babamba-and-bibibig.github.io/"
title = "Learning AI"
description = "Rust와 AI를 공부하며 직접 만든 것과 해결한 문제를 기록합니다."
default_language = "ko"
theme = "duckquill"
compile_sass = true
minify_html = true
build_search_index = false

# 코드 블록의 언어별 문법 색상을 켭니다.
# 밝은 테마와 어두운 테마에 맞는 색상을 함께 생성합니다.
[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
style = "inline"
# 언어 이름과 줄 번호 정보를 코드 상자와 코드 본문에 전달합니다.
data_attr_position = "both"

[extra]
# 첫 방문 시 어두운 화면으로 시작합니다.
# 이전에 방문자가 저장한 밝기 설정이 있으면 그 선택이 우선할 수 있습니다.
default_theme = "dark"

# 기본 강조색입니다. 실제 밝기별 배색은 reactor-ui-v4.css에서 지정합니다.
accent_color = "#b32035"
accent_color_dark = "#ff6a78"

# 테마의 별도 번들 글꼴 대신 사용자 CSS의 Pretendard를 사용합니다.
bundled_fonts = false

# 기존 디자인은 유지하고 코드 표시 전용 스타일만 추가합니다.
styles = ["reactor-ui-v4.css", "code-blocks.css"]

# 기존 글 읽기 기능을 유지합니다.
show_copy_button = true
show_reading_time = true

[extra.nav]
show_theme_switcher = true
show_feed = false
links = [
    { url = "@/_index.md", name = "Notes" },
    { url = "https://github.com/Babamba-and-Bibibig", name = "GitHub" }
]
