# 현재 블로그 주소입니다. 그대로 유지합니다.
base_url = "https://babamba-and-bibibig.github.io/"

# 현재 작성한 블로그 제목과 소개를 유지합니다.
title = "학습 블로그 입니다."
description = "Rust와 AI를 공부하며 직접 만든 것과 해결한 문제를 기록합니다."
default_language = "ko"

# 앞 단계에서 내려받은 Duckquill 테마를 사용합니다.
theme = "duckquill"

# 앞으로 추가할 디자인 파일도 웹페이지용 스타일로 변환합니다.
compile_sass = true

# 완성된 HTML 파일에서 불필요한 공백 등을 줄입니다.
minify_html = true

# 검색 기능은 홈과 글 목록 구성을 마친 뒤 설정합니다.
build_search_index = false

[extra]
# Duckquill의 기본 계열인 주황색을 강조색으로 사용합니다.
accent_color = "#ff7800"

# 어두운 화면에서는 더 밝은 주황색을 사용합니다.
accent_color_dark = "#ffa348"

# 언어가 지정된 코드 블록에 코드 복사 버튼을 표시합니다.
show_copy_button = true

# 글을 읽는 데 필요한 예상 시간을 표시합니다.
show_reading_time = true

[extra.nav]
# 밝은 화면과 어두운 화면을 전환하는 버튼을 표시합니다.
show_theme_switcher = true

# 새 글 구독 기능은 아직 설정하지 않았으므로 버튼을 숨깁니다.
show_feed = false

# 지금 실제로 존재하는 페이지와 GitHub만 메뉴에 연결합니다.
# 프로젝트 메뉴는 프로젝트 페이지를 만든 뒤 추가합니다.
links = [
    { url = "@/_index.md", name = "공부 기록" },
    { url = "https://github.com/Babamba-and-Bibibig", name = "GitHub" }
]
