# 기존 주소·제목·글은 그대로 유지합니다.
base_url = "https://babamba-and-bibibig.github.io/"
title = "학습 블로그 입니다."
description = "Rust와 AI를 공부하며 직접 만든 것과 해결한 문제를 기록합니다."
default_language = "ko"
theme = "duckquill"
compile_sass = true
minify_html = true
build_search_index = false

[extra]
# 첫 방문 시 어두운 화면으로 시작합니다.
# 이전에 방문자가 저장한 밝기 설정이 있으면 그 선택이 우선할 수 있습니다.
default_theme = "dark"

# 주황색 대신 레드를 사용합니다. 나머지 배색은 iron-lab.css에서 정합니다.
accent_color = "#b32035"
accent_color_dark = "#ff6a78"

# 테마의 별도 번들 글꼴 대신 사용자 CSS의 Pretendard를 사용합니다.
bundled_fonts = false

# static/iron-lab.css를 불러옵니다. 파일 이름이 정확히 일치해야 합니다.
styles = ["iron-lab.css"]

# 기존 글 읽기 기능을 유지합니다.
show_copy_button = true
show_reading_time = true

[extra.nav]
show_theme_switcher = true
show_feed = false
links = [
    { url = "@/_index.md", name = "공부 기록" },
    { url = "https://github.com/Babamba-and-Bibibig", name = "GitHub" }
]
